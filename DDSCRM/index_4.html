<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dover Digital Signs — Customer Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2430;
    --muted:#6b7480;
    --paper:#f6f4ef;
    --panel:#ffffff;
    --navy:#111827;
    --navy-2:#1c2940;
    --line:#e4e0d6;
    --amber:#f2a71b;
    --amber-glow: 0 0 0 1px rgba(242,167,27,.5), 0 0 14px rgba(242,167,27,.55);
    --overdue:#d9542a;
    --overdue-glow: 0 0 0 1px rgba(217,84,42,.55), 0 0 14px rgba(217,84,42,.5);
    --good:#3f7a5c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .mono{ font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing:.02em; }

  header{
    background:linear-gradient(180deg,var(--navy),var(--navy-2));
    color:#f4f1ea;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    width:34px;height:22px;border-radius:3px;
    background:#0b0f16;
    border:1px solid #333;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:3px;
  }
  .brand .mark span{ background:var(--amber); border-radius:1px; opacity:.85; }
  .brand .mark span:nth-child(3),.brand .mark span:nth-child(7),.brand .mark span:nth-child(10){opacity:.3;}
  .brand h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:.01em;}
  .brand .sub{ font-size:11.5px; color:#b9c2cf; margin-top:2px; }

  .who{ display:flex; align-items:center; gap:10px; font-size:13px; color:#dfe4ea;}
  .who input{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:6px; padding:6px 8px; font-size:13px; width:130px;
  }

  nav{
    display:flex; gap:2px; background:var(--navy-2); padding:0 22px;
  }
  nav button{
    background:transparent; border:none; color:#c7cedb; padding:10px 16px;
    font-size:13.5px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600;
  }
  nav button.active{ color:#fff; border-bottom-color:var(--amber); }

  .toolbar{
    display:flex; gap:10px; align-items:center; padding:14px 22px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px;
    background:#fff;
  }
  .toolbar input[type=text]{ min-width:220px; flex:1; }
  .btn{
    background:var(--navy); color:#fff; border:none; padding:9px 14px;
    border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn.amber{ background:var(--amber); color:#3a2a06; }
  .btn.ghost{ background:transparent; color:var(--navy); border:1px solid var(--line); }
  .btn.small{ padding:5px 10px; font-size:12.5px; }
  .btn.danger{ background:transparent; color:var(--overdue); border:1px solid rgba(217,84,42,.4);}
  .btn:disabled{ opacity:.6; cursor:default; }

  main{ padding:18px 22px 60px; max-width:1180px; margin:0 auto; }

  .layout{ display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .list{ max-height:74vh; overflow:auto; }
  .cust-item{
    padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .cust-item:hover{ background:#faf8f3; }
  .cust-item.sel{ background:#fdf3df; }
  .cust-item .name{ font-weight:700; font-size:14px; }
  .cust-item .addr{ font-size:12px; color:var(--muted); margin-top:2px;}
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 6px; border-radius:20px;
    background:#eef1f5; color:var(--muted); margin-top:5px; font-weight:600;
  }
  .empty{ padding:30px 16px; color:var(--muted); font-size:13.5px; text-align:center; }
  .errbox{ padding:14px 16px; background:#fdece5; color:#8a2f10; border-radius:8px; font-size:13px; margin-bottom:14px; }

  .detail{ padding:18px; }
  .detail h2{ margin:0 0 2px; font-size:19px; }
  .detail .addr-line{ color:var(--muted); font-size:13.5px; margin-bottom:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:10px 0 16px; }
  .field label{ display:block; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .field input, .field textarea{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13.5px;
    background:#fff;
  }
  .field textarea{ resize:vertical; min-height:32px; }
  .row-actions{ display:flex; gap:8px; margin-top:6px; }

  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    font-weight:700; margin:22px 0 8px; display:flex; align-items:center; justify-content:space-between;
  }

  .note{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; background:#fffdf9;
  }
  .note .meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .note .text{ font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .badge{
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size:11px; padding:3px 8px; border-radius:5px; font-weight:700; letter-spacing:.03em;
  }
  .badge.upcoming{ background:#fff7e6; color:#8a5a00; box-shadow:var(--amber-glow); }
  .badge.overdue{ background:#fdece5; color:#8a2f10; box-shadow:var(--overdue-glow); }
  .badge.done{ background:#eaf3ee; color:var(--good); }
  .photos{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .photos img{ width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer; }

  .newnote{ border:1px dashed var(--line); border-radius:8px; padding:12px 14px; background:#fbfaf6; }
  .newnote textarea{ width:100%; min-height:60px; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13.5px; font-family:inherit; }
  .newnote .row{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .newnote input[type=date]{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; }
  .newnote input[type=file]{ font-size:12px; }

  .followup-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .followup-row:last-child{ border-bottom:none; }
  .followup-row .co{ font-weight:700; font-size:14px; }
  .followup-row .snippet{ font-size:12.5px; color:var(--muted); margin-top:3px; max-width:520px;}

  .modal-bg{ position:fixed; inset:0; background:rgba(15,20,26,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{ background:#fff; border-radius:10px; padding:20px 22px; width:100%; max-width:520px; max-height:88vh; overflow:auto;}
  .modal h3{ margin-top:0; }
  .lightbox{ position:fixed; inset:0; background:rgba(10,12,16,.85); display:flex; align-items:center; justify-content:center; z-index:60; cursor:zoom-out;}
  .lightbox img{ max-width:90vw; max-height:90vh; border-radius:6px; }

  .toast{
    position:fixed; bottom:18px; right:18px; background:var(--navy); color:#fff; padding:10px 16px;
    border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:70;
  }
  .loading{ text-align:center; color:var(--muted); padding:40px; font-size:13.5px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================
   CONFIG — fill these in from your Supabase project
   Settings -> API -> Project URL / anon public key
   ========================================================= */
const SUPABASE_URL = "https://nlahmlqtzgscxllzopua.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sYWhtbHF0emdzY3hsbHpvcHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzM2ODgsImV4cCI6MjA5OTQ0OTY4OH0.pmT48FdVOkKhBUto7Il1j4LeQ_j_o_XkLWyFl6qlltg";
const PHOTO_BUCKET = "reader-board-photos";
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const configured = !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");

const state = {
  customers: [],
  notes: [],
  view: 'customers',
  selectedId: null,
  search: '',
  sourceFilter: 'ALL',
  currentUser: localStorage.getItem('dds_user') || '',
  loading: true,
  error: null,
  toast: null,
  lightboxSrc: null,
  addingCustomer: false,
  editingCustomer: false,
};

const DEFAULT_SOURCE = 'Dover Digital Signs (Main)';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-CA', {year:'numeric',month:'short',day:'numeric'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){ const a = new Date(todayStr()+'T00:00:00'); const b = new Date(d+'T00:00:00'); return Math.round((b-a)/86400000); }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2200); }
function saveUser(name){ state.currentUser = name; localStorage.setItem('dds_user', name); }

async function loadAll(){
  if(!configured){ state.loading=false; render(); return; }
  state.loading = true; state.error = null; render();
  const [{data:custs, error:cErr}, {data:notes, error:nErr}] = await Promise.all([
    sb.from('customers').select('*'),
    sb.from('notes').select('*'),
  ]);
  if(cErr || nErr){
    state.error = (cErr && cErr.message) || (nErr && nErr.message);
  } else {
    state.customers = custs || [];
    state.notes = notes || [];
  }
  state.loading = false;
  render();
}

// ---------- derived helpers ----------
function allSources(){
  const s = new Set([DEFAULT_SOURCE]);
  state.customers.forEach(c => s.add(c.source || DEFAULT_SOURCE));
  return Array.from(s);
}
function filteredCustomers(){
  let list = state.customers;
  if(state.sourceFilter !== 'ALL'){
    list = list.filter(c => (c.source || DEFAULT_SOURCE) === state.sourceFilter);
  }
  const q = state.search.trim().toLowerCase();
  if(q){
    const matchingNoteCustIds = new Set(
      state.notes.filter(n => (n.note_text||'').toLowerCase().includes(q)).map(n => n.customer_id)
    );
    list = list.filter(c =>
      (c.company||'').toLowerCase().includes(q) ||
      (c.street||'').toLowerCase().includes(q) ||
      (c.city||'').toLowerCase().includes(q) ||
      (c.contact||'').toLowerCase().includes(q) ||
      (c.postal_code||'').toLowerCase().includes(q) ||
      matchingNoteCustIds.has(c.id)
    );
  }
  return list.slice().sort((a,b)=> (a.company||'').localeCompare(b.company||''));
}
function notesFor(custId){
  return state.notes.filter(n => n.customer_id === custId).sort((a,b)=> (b.date_of_note||'').localeCompare(a.date_of_note||''));
}
function allFollowUps(){
  return state.notes
    .filter(n => n.follow_up_date)
    .map(n => ({ note:n, cust: state.customers.find(c=>c.id===n.customer_id) }))
    .filter(x => x.cust)
    .sort((a,b)=> a.note.follow_up_date.localeCompare(b.note.follow_up_date));
}

// ---------- image compression + upload ----------
function compressToBlob(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.7);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(custId, blob){
  const path = `${custId}/${uid()}.jpg`;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// ---------- actions ----------
async function addCustomer(data){
  const { data: rows, error } = await sb.from('customers').insert([data]).select();
  if(error){ showToast('Save failed: ' + error.message); return; }
  state.customers.push(rows[0]);
  state.addingCustomer = false;
  state.selectedId = rows[0].id;
  render();
  showToast('Customer added');
}
async function updateCustomer(id, data){
  const { error } = await sb.from('customers').update(data).eq('id', id);
  if(error){ showToast('Save failed: ' + error.message); return; }
  const c = state.customers.find(c=>c.id===id);
  Object.assign(c, data);
  state.editingCustomer = false;
  render();
  showToast('Saved');
}
async function deleteCustomer(id){
  const { error } = await sb.from('customers').delete().eq('id', id);
  if(error){ showToast('Delete failed: ' + error.message); return; }
  state.customers = state.customers.filter(c=>c.id!==id);
  state.notes = state.notes.filter(n=>n.customer_id!==id);
  state.selectedId = null;
  render();
  showToast('Customer deleted');
}
async function addNote(custId, data){
  const payload = { customer_id: custId, created_by: state.currentUser || 'Unknown', ...data };
  const { data: rows, error } = await sb.from('notes').insert([payload]).select();
  if(error){ showToast('Save failed: ' + error.message); return; }
  state.notes.push(rows[0]);
  render();
  showToast('Note added');
}
async function deleteNote(id){
  const { error } = await sb.from('notes').delete().eq('id', id);
  if(error){ showToast('Delete failed: ' + error.message); return; }
  state.notes = state.notes.filter(n=>n.id!==id);
  render();
}

// ---------- render ----------
function render(){
  const root = document.getElementById('root');
  if(!configured){
    root.innerHTML = headerHtml() + `<main><div class="errbox">
      This app isn't connected to a database yet. Open <code>index.html</code> and fill in
      <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the file.
    </div></main>`;
    bindHeaderEvents();
    return;
  }
  if(state.loading){
    root.innerHTML = headerHtml() + '<div class="loading">Loading customer data…</div>';
    bindHeaderEvents();
    return;
  }
  let body = '';
  if(state.error){
    body = `<main><div class="errbox">Couldn't load data: ${esc(state.error)}</div></main>`;
  } else if(state.view === 'customers'){
    body = customersViewHtml();
  } else {
    body = followupsViewHtml();
  }

  root.innerHTML = headerHtml() + navHtml() + body +
    (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : '') +
    (state.lightboxSrc ? `<div class="lightbox" id="lightbox"><img src="${state.lightboxSrc}"></div>` : '') +
    modalsHtml();

  bindEvents();
}

function headerHtml(){
  return `
  <header>
    <div class="brand">
      <div class="mark">${Array.from({length:12}).map(()=>'<span></span>').join('')}</div>
      <div>
        <h1>Dover Digital Signs</h1>
        <div class="sub">Customer Tracker</div>
      </div>
    </div>
    <div class="who">
      <span>Signed in as</span>
      <input id="userNameInput" type="text" placeholder="your name" value="${esc(state.currentUser)}">
    </div>
  </header>`;
}

function navHtml(){
  return `
  <nav>
    <button data-view="customers" class="${state.view==='customers'?'active':''}">Customers</button>
    <button data-view="followups" class="${state.view==='followups'?'active':''}">Follow-Ups${
      (()=>{ const n = allFollowUps().filter(x=>daysUntil(x.note.follow_up_date)<=0).length; return n>0 ? ` (${n})` : ''; })()
    }</button>
  </nav>`;
}

function customersViewHtml(){
  const list = filteredCustomers();
  const sel = state.customers.find(c=>c.id===state.selectedId);
  return `
  <main>
    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search company, address, contact, or note text…" value="${esc(state.search)}">
      <select id="sourceFilterSel">
        <option value="ALL" ${state.sourceFilter==='ALL'?'selected':''}>All sources</option>
        ${allSources().map(s=>`<option value="${esc(s)}" ${state.sourceFilter===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <button class="btn amber" id="newCustomerBtn">+ New Customer</button>
    </div>
    <div class="layout">
      <div class="card list">
        ${list.length===0 ? `<div class="empty">No customers yet.<br>Add your first one to get started.</div>` :
          list.map(c => `
            <div class="cust-item ${c.id===state.selectedId?'sel':''}" data-id="${c.id}">
              <div class="name">${esc(c.company||'(no company name)')}</div>
              <div class="addr">${esc([c.street,c.city,c.province].filter(Boolean).join(', '))}</div>
              <span class="tag">${esc(c.source||DEFAULT_SOURCE)}</span>
            </div>`).join('')}
      </div>
      <div class="card">
        ${sel ? customerDetailHtml(sel) : `<div class="empty">Select a customer on the left, or add a new one.</div>`}
      </div>
    </div>
  </main>`;
}

function customerDetailHtml(c){
  const notes = notesFor(c.id);
  return `
  <div class="detail">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h2>${esc(c.company||'(no company name)')}</h2>
        <div class="addr-line">${esc([c.street, c.city, c.province, c.postal_code].filter(Boolean).join(', ')) || 'No address on file'}</div>
      </div>
      <div class="row-actions">
        <button class="btn ghost small" data-edit-cust="${c.id}">Edit</button>
        <button class="btn danger small" data-del-cust="${c.id}">Delete</button>
      </div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <div><span class="tag">${esc(c.source||DEFAULT_SOURCE)}</span></div>
    </div>
    <div class="grid2">
      <div><strong>Contact:</strong> ${esc(c.contact)||'—'}</div>
      <div><strong>Phone:</strong> <span class="mono">${esc(c.phone)||'—'}</span></div>
      <div><strong>Email:</strong> ${esc(c.email)||'—'}</div>
      <div><strong>Existing sign size:</strong> ${esc(c.size_of_existing_sign)||'—'}</div>
    </div>

    <div class="section-title">Add a note</div>
    <div class="newnote">
      <textarea id="noteText" placeholder="What did you discuss? Reader board condition, pricing, next steps…"></textarea>
      <div class="row">
        <label class="mono" style="font-size:11.5px;">Date of note
          <input type="date" id="noteDate" value="${todayStr()}">
        </label>
        <label class="mono" style="font-size:11.5px;">Follow up on
          <input type="date" id="noteFollowUp">
        </label>
        <label style="font-size:12px;">Reader board photo(s)
          <input type="file" id="notePhotos" accept="image/*" multiple>
        </label>
        <button class="btn" id="saveNoteBtn" data-cust="${c.id}">Save Note</button>
      </div>
    </div>

    <div class="section-title">History (${notes.length})</div>
    ${notes.length===0 ? `<div class="empty">No notes yet for this customer.</div>` :
      notes.map(n => noteHtml(n)).join('')}
  </div>`;
}

function followUpBadge(followUpDate){
  if(!followUpDate) return '';
  const d = daysUntil(followUpDate);
  let cls = 'upcoming', label = `Follow up ${fmtDate(followUpDate)}`;
  if(d < 0){ cls='overdue'; label = `Overdue — was due ${fmtDate(followUpDate)}`; }
  else if(d === 0){ cls='overdue'; label = `Due today`; }
  else if(d <= 3){ cls='upcoming'; label = `Due in ${d}d — ${fmtDate(followUpDate)}`; }
  else { cls='done'; label = `Follow up ${fmtDate(followUpDate)}`; }
  return `<span class="badge ${cls}">${label}</span>`;
}

function noteHtml(n){
  return `
  <div class="note">
    <div class="meta">
      <span>${fmtDate(n.date_of_note)} · <strong>${esc(n.created_by||'Unknown')}</strong></span>
      <span style="display:flex; gap:8px; align-items:center;">
        ${followUpBadge(n.follow_up_date)}
        <button class="btn ghost small" data-del-note="${n.id}" style="padding:2px 8px;">✕</button>
      </span>
    </div>
    <div class="text">${esc(n.note_text)}</div>
    ${n.photos && n.photos.length ? `<div class="photos">${n.photos.map(p=>`<img src="${p}" data-lightbox="${p}">`).join('')}</div>` : ''}
  </div>`;
}

function followupsViewHtml(){
  const items = allFollowUps();
  return `
  <main>
    <div class="toolbar">
      <div style="font-size:13.5px; color:var(--muted);">Every note with a follow-up date, soonest first.</div>
    </div>
    <div class="card">
      ${items.length===0 ? `<div class="empty">No follow-ups scheduled.</div>` :
        items.map(({note,cust}) => `
        <div class="followup-row">
          <div>
            <div class="co">${esc(cust.company||'(no company name)')}</div>
            <div class="snippet">${esc(note.note_text.slice(0,140))}${note.note_text.length>140?'…':''}</div>
          </div>
          <div style="display:flex; gap:10px; align-items:center; flex-shrink:0;">
            ${followUpBadge(note.follow_up_date)}
            <button class="btn ghost small" data-goto-cust="${cust.id}">Open</button>
          </div>
        </div>`).join('')}
    </div>
  </main>`;
}

function modalsHtml(){
  if(state.addingCustomer) return customerFormModal(null);
  if(state.editingCustomer) return customerFormModal(state.customers.find(c=>c.id===state.selectedId));
  return '';
}

function customerFormModal(existing){
  const c = existing || {};
  return `
  <div class="modal-bg" id="custModalBg">
    <div class="modal">
      <h3>${existing ? 'Edit Customer' : 'New Customer'}</h3>
      <div class="grid2">
        <div class="field"><label>Company</label><input id="f_company" value="${esc(c.company)}"></div>
        <div class="field"><label>Contact</label><input id="f_contact" value="${esc(c.contact)}"></div>
        <div class="field"><label>Street</label><input id="f_street" value="${esc(c.street)}"></div>
        <div class="field"><label>City</label><input id="f_city" value="${esc(c.city)}"></div>
        <div class="field"><label>Province</label><input id="f_province" value="${esc(c.province)}"></div>
        <div class="field"><label>Postal Code</label><input id="f_postal" class="mono" value="${esc(c.postal_code)}"></div>
        <div class="field"><label>Phone Number</label><input id="f_phone" class="mono" value="${esc(c.phone)}"></div>
        <div class="field"><label>Email</label><input id="f_email" value="${esc(c.email)}"></div>
        <div class="field"><label>Size of Existing Sign</label><input id="f_size" value="${esc(c.size_of_existing_sign)}"></div>
        <div class="field"><label>Source (office / franchisee)</label>
          <input id="f_source" list="sourceOptions" value="${esc(c.source||DEFAULT_SOURCE)}">
          <datalist id="sourceOptions">${allSources().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
        </div>
      </div>
      <div class="row-actions" style="justify-content:flex-end; margin-top:14px;">
        <button class="btn ghost" id="cancelCustModal">Cancel</button>
        <button class="btn amber" id="saveCustModal" data-existing="${existing ? existing.id : ''}">Save</button>
      </div>
    </div>
  </div>`;
}

// ---------- events ----------
function bindHeaderEvents(){
  const input = document.getElementById('userNameInput');
  if(input){
    input.addEventListener('change', e => saveUser(e.target.value.trim()));
  }
}

function bindEvents(){
  bindHeaderEvents();

  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick = () => { state.view = b.dataset.view; render(); };
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = e => { state.search = e.target.value; render(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); };
  }
  const sourceSel = document.getElementById('sourceFilterSel');
  if(sourceSel){ sourceSel.onchange = e => { state.sourceFilter = e.target.value; render(); }; }

  const newBtn = document.getElementById('newCustomerBtn');
  if(newBtn){ newBtn.onclick = () => { state.addingCustomer = true; render(); }; }

  document.querySelectorAll('.cust-item').forEach(el=>{
    el.onclick = () => { state.selectedId = el.dataset.id; render(); };
  });

  document.querySelectorAll('[data-edit-cust]').forEach(el=>{
    el.onclick = (e) => { e.stopPropagation(); state.editingCustomer = true; render(); };
  });
  document.querySelectorAll('[data-del-cust]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Delete this customer and all their notes? This cannot be undone.')){
        deleteCustomer(el.dataset.delCust);
      }
    };
  });
  document.querySelectorAll('[data-goto-cust]').forEach(el=>{
    el.onclick = () => { state.view='customers'; state.selectedId = el.dataset.gotoCust; render(); };
  });
  document.querySelectorAll('[data-del-note]').forEach(el=>{
    el.onclick = () => { if(confirm('Delete this note?')) deleteNote(el.dataset.delNote); };
  });
  document.querySelectorAll('[data-lightbox]').forEach(el=>{
    el.onclick = () => { state.lightboxSrc = el.dataset.lightbox; render(); };
  });
  const lb = document.getElementById('lightbox');
  if(lb){ lb.onclick = () => { state.lightboxSrc = null; render(); }; }

  const saveNoteBtn = document.getElementById('saveNoteBtn');
  if(saveNoteBtn){
    saveNoteBtn.onclick = async () => {
      const custId = saveNoteBtn.dataset.cust;
      const note_text = document.getElementById('noteText').value.trim();
      const date_of_note = document.getElementById('noteDate').value || todayStr();
      const follow_up_date = document.getElementById('noteFollowUp').value || null;
      const files = document.getElementById('notePhotos').files;
      if(!note_text){ showToast('Write a note first'); return; }
      if(!state.currentUser){ showToast('Enter your name up top so we know who wrote this'); return; }
      saveNoteBtn.disabled = true; saveNoteBtn.textContent = 'Saving…';
      let photos = [];
      try{
        for(const f of files){
          const blob = await compressToBlob(f);
          const url = await uploadPhoto(custId, blob);
          photos.push(url);
        }
      }catch(e){ showToast('Some photo(s) failed to upload, saving note anyway'); }
      await addNote(custId, { note_text, date_of_note, follow_up_date, photos });
    };
  }

  const cancelBtn = document.getElementById('cancelCustModal');
  if(cancelBtn){ cancelBtn.onclick = () => { state.addingCustomer=false; state.editingCustomer=false; render(); }; }
  const saveCustBtn = document.getElementById('saveCustModal');
  if(saveCustBtn){
    saveCustBtn.onclick = async () => {
      const data = {
        company: document.getElementById('f_company').value.trim(),
        contact: document.getElementById('f_contact').value.trim(),
        street: document.getElementById('f_street').value.trim(),
        city: document.getElementById('f_city').value.trim(),
        province: document.getElementById('f_province').value.trim(),
        postal_code: document.getElementById('f_postal').value.trim(),
        phone: document.getElementById('f_phone').value.trim(),
        email: document.getElementById('f_email').value.trim(),
        size_of_existing_sign: document.getElementById('f_size').value.trim(),
        source: document.getElementById('f_source').value.trim() || DEFAULT_SOURCE,
      };
      if(!data.company){ showToast('Company name is required'); return; }
      const existingId = saveCustBtn.dataset.existing;
      if(existingId){ await updateCustomer(existingId, data); }
      else{ await addCustomer(data); }
    };
  }
}

loadAll();
</script>
</body>
</html>
