<style>
  :root{
    --ink:#1c2430;
    --muted:#6b7480;
    --paper:#f6f4ef;
    --panel:#ffffff;
    --navy:#111827;
    --navy-2:#1c2940;
    --line:#e4e0d6;
    --amber:#f2a71b;
    --amber-glow: 0 0 0 1px rgba(242,167,27,.5), 0 0 14px rgba(242,167,27,.55);
    --overdue:#d9542a;
    --overdue-glow: 0 0 0 1px rgba(217,84,42,.55), 0 0 14px rgba(217,84,42,.5);
    --good:#3f7a5c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .mono{ font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing:.02em; }

  header{
    background:linear-gradient(180deg,var(--navy),var(--navy-2));
    color:#f4f1ea;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    width:34px;height:22px;border-radius:3px;
    background:#0b0f16;
    border:1px solid #333;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:3px;
  }
  .brand .mark span{ background:var(--amber); border-radius:1px; opacity:.85; }
  .brand .mark span:nth-child(3),.brand .mark span:nth-child(7),.brand .mark span:nth-child(10){opacity:.3;}
  .brand h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:.01em;}
  .brand .sub{ font-size:11.5px; color:#b9c2cf; margin-top:2px; }

  .who{ display:flex; align-items:center; gap:10px; font-size:13px; color:#dfe4ea;}
  .who input{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:6px; padding:6px 8px; font-size:13px; width:130px;
  }

  nav{
    display:flex; gap:2px; background:var(--navy-2); padding:0 22px;
  }
  nav button{
    background:transparent; border:none; color:#c7cedb; padding:10px 16px;
    font-size:13.5px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600;
  }
  nav button.active{ color:#fff; border-bottom-color:var(--amber); }

  .toolbar{
    display:flex; gap:10px; align-items:center; padding:14px 22px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px;
    background:#fff;
  }
  .toolbar input[type=text]{ min-width:220px; flex:1; }
  .btn{
    background:var(--navy); color:#fff; border:none; padding:9px 14px;
    border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer;
  }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function telHref(phone){ return (phone||'').replace(/[^\d+]/g, ''); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){ const a = new Date(todayStr()+'T00:00:00'); const b = new Date(d+'T00:00:00'); return Math.round((b-a)/86400000); }

// ---------- auth / bootstrap ----------
async function boot(){
  if(!configured){ state.bootLoading = false; render(); return; }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if(state.session){ await afterLogin(); }
  else { state.bootLoading = false; render(); }

  sb.auth.onAuthStateChange((event, session) => {
    const hadSession = !!state.session;
    state.session = session;
    if(session && !hadSession){ afterLogin(); }
    else if(!session){
      state.profile = null; state.profilesList = []; state.territories = [];
      state.customers = []; state.notes = []; state.contacts = []; state.folders = [];
      state.bootLoading = false; render();
    }
  });
}

async function afterLogin(){
  state.bootLoading = true; render();
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(error){
    state.authError = 'Could not load your profile: ' + error.message;
    state.bootLoading = false; render(); return;
  }
  state.profile = prof;
  const { data: terrs } = await sb.from('territories').select('*');
  state.territories = terrs || [];
  state.bootLoading = false;
  if(isAdmin() || prof.territory_id){ await loadAll(); }
  else { render(); }
}

async function doSignUp(email, password){
  state.authBusy = true; state.authError = null; render();
  const { error } = await sb.auth.signUp({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  state.authMode = 'login';
  state.authError = null;
  render();
  showToast('Account created — check your email if confirmation is required, then log in.');
}
async function doLogin(email, password){
  state.authBusy = true; state.authError = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); }
}
async function doSignOut(){
  await sb.auth.signOut();
}

// ---------- derived helpers ----------
function allFolders(){
  const names = new Set(state.folders.map(f=>f.name));
  return Array.from(names).sort();
}
async function ensureFolderExists(name, territory_id){
  if(!name) return;
  if(state.folders.some(f=>f.name===name)) return;
  const { data, error } = await sb.from('folders').insert([{ name, territory_id }]).select();
  if(error){
    if(!/duplicate|unique/i.test(error.message)) showToast('Could not create folder: ' + error.message);
    return;
  }
  if(data && data[0]) state.folders.push(data[0]);
}
async function deleteFolder(name){
  const { error: uErr } = await sb.from('customers').update({ folder: null }).eq('folder', name);
  if(uErr){ showToast('Delete failed: ' + uErr.message); return; }
  const folderRow = state.folders.find(f=>f.name===name);
  if(folderRow){
    const { error: dErr } = await sb.from('folders').delete().eq('id', folderRow.id);
    if(dErr){ showToast('Delete failed: ' + dErr.message); return; }
    state.folders = state.folders.filter(f=>f.id!==folderRow.id);
  }
  state.customers.forEach(c=>{ if(c.folder===name) c.folder=null; });
  if(state.folderFilter===name) state.folderFilter='ALL';
  render();
  showToast('Folder deleted');
}
function contactsFor(custId){
  return state.contacts.filter(ct => ct.customer_id === custId);
}
function filteredCustomers(){
  let list = state.customers;
  if(state.folderFilter !== 'ALL'){
    list = list.filter(c => (c.folder || '') === state.folderFilter);
  }
  const q = state.search.trim().toLowerCase();
  if(q){
    const matchingNoteCustIds = new Set(
      state.notes.filter(n => (n.note_text||'').toLowerCase().includes(q)).map(n => n.customer_id)
    );
    const matchingContactCustIds = new Set(
      state.contacts.filter(ct => (ct.name||'').toLowerCase().includes(q) || (ct.phone||'').toLowerCase().includes(q))
        .map(ct => ct.customer_id)
    );
    list = list.filter(c =>
      (c.company||'').toLowerCase().includes(q) ||
      (c.street||'').toLowerCase().includes(q) ||
      (c.city||'').toLowerCase().includes(q) ||
      (c.postal_code||'').toLowerCase().includes(q) ||
      matchingNoteCustIds.has(c.id) ||
      matchingContactCustIds.has(c.id)
    );
  }
  return list.slice().sort((a,b)=> (a.company||'').localeCompare(b.company||''));
}
function notesFor(custId){
  return state.notes.filter(n => n.customer_id === custId).sort((a,b)=> (b.date_of_note||'').localeCompare(a.date_of_note||''));
}
function estimatesFor(custId){
  return state.estimates.filter(e => e.customer_id === custId).sort((a,b)=> (b.date_of_estimate||'').localeCompare(a.date_of_estimate||''));
}
function allFollowUps(){
  return state.notes
    .filter(n => n.follow_up_date)
    .map(n => ({ note:n, cust: state.customers.find(c=>c.id===n.customer_id) }))
    .filter(x => x.cust)
    .sort((a,b)=> a.note.follow_up_date.localeCompare(b.note.follow_up_date));
}

// ---------- image compression + upload ----------
function compressToBlob(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.7);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(custId, blob){
  const path = `${custId}/${uid()}.jpg`;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// ---------- data actions ----------
async function loadAll(){
  state.loading = true; state.error = null; render();
  const calls = [
    sb.from('customers').select('*'),
    sb.from('notes').select('*'),
    sb.from('contacts').select('*'),
    sb.from('folders').select('*'),
    sb.from('estimates').select('*'),
  ];
  if(isAdmin()) calls.push(sb.from('profiles').select('*'));

  const results = await Promise.all(calls);
  const errs = results.map(r=>r.error).filter(Boolean);
  if(errs.length){
    state.error = errs[0].message;
  } else {
    state.customers = results[0].data || [];
    state.notes = results[1].data || [];
    state.contacts = results[2].data || [];
    state.folders = results[3].data || [];
    state.estimates = results[4].data || [];
    if(isAdmin()) state.profilesList = (results[5] && results[5].data) || [];
  }
  state.loading = false;
  render();
}
async function addCustomer(data){
  const { data: rows, error } = await sb.from('customers').insert([data]).select();
  if(error){ showToast('Save failed: ' + error.message); return; }
  state.customers.push(rows[0]);
  state.addingCustomer = false;
  state.selectedId = rows[0].id;
  render();
  showToast('Customer added');
}
async function updateCustomer(id, data){
  const { error } = await sb.from('customers').update(data).eq('id', id);
  if(error){ showToast('Save failed: ' + error.message); return; }
  const c = state.customers.find(c=>c.id===id);
  Object.assign(c, data);
  state.editingCustomer = false;
  render();
  showToast('Saved');
}
async function deleteCustomer(id){
  const { error } = await sb.from('customers').delete().eq('id', id);
  if(error){ showToast('Delete failed: ' + error.message); return; }

  state.notes = state.notes.filter(n=>n.customer_id!==id);
  state.contacts = state.contacts.filter(ct=>ct.customer_id!==id);
  state.selectedId = null;
  render();
  showToast('Customer deleted');
}

async function deleteNote(id){

async function addEstimate(custId, data){

async function deleteEstimate(id){

async function addContact(custId, data){

async function saveProfile(id, data){

// ---------- render ----------
function render(){
  const root = document.getElementById('root');
  if(!configured){
    const msg = libraryFailedToLoad
      ? `Couldn't load a required file from the internet (the Supabase library). Check your internet connection and reload the page.`
      : `This app isn't connected to a database yet. Open <code>index.html</code> and fill in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the file.`;
    root.innerHTML = brandHeaderHtml() + `<main><div class="errbox">${msg}</div></main>`;
    return;
  }
  if(state.bootLoading){
    root.innerHTML = brandHeaderHtml() + '<div class="loading">Loading…</div>' + toastHtml();
    return;
  }
  if(!state.session){
    root.innerHTML = authScreenHtml() + toastHtml();
    bindAuthEvents();
    return;
  }
  if(!state.profile){
    root.innerHTML = brandHeaderHtml() + '<div class="loading">Loading your profile…</div>' + toastHtml();
    return;
  }
  if(!isAdmin() && !state.profile.territory_id){
    root.innerHTML = pendingAssignmentHtml() + toastHtml();
    bindPendingEvents();
    return;
  }
  if(state.loading){
    root.innerHTML = headerHtml() + '<div class="loading">Loading customer data…</div>' + toastHtml();
    bindHeaderEvents();
    return;
  }
  let body = '';
  if(state.error){
    body = `<main><div class="errbox">Couldn't load data: ${esc(state.error)}</div></main>`;
  } else if(state.view === 'customers'){
    body = customersViewHtml();
  } else if(state.view === 'folders'){
    body = foldersViewHtml();
  } else if(state.view === 'team'){
    body = teamViewHtml();
  } else {
    body = followupsViewHtml();
  }

  root.innerHTML = headerHtml() + navHtml() + body + toastHtml() + lightboxHtml() + modalsHtml();
  bindEvents();
}

function brandHeaderHtml(){
  return `

function authScreenHtml(){
  return `
  ${brandHeaderHtml()}
  <main style="max-width:420px; margin:60px auto;">
    <div class="card" style="padding:24px;">
      <h2 style="margin-top:0;">${state.authMode==='login' ? 'Log In' : 'Create an Account'}</h2>
      ${state.authError ? `<div class="errbox">${esc(state.authError)}</div>` : ''}
      <div class="field" style="margin-bottom:10px;"><label>Email</label><input type="email" id="authEmail"></div>
      <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="authPassword"></div>
      <button class="btn amber" id="authSubmitBtn" style="width:100%;" ${state.authBusy?'disabled':''}>
        ${state.authBusy ? 'Please wait…' : (state.authMode==='login' ? 'Log In' : 'Sign Up')}
      </button>
      <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--muted);">
        ${state.authMode==='login'
          ? `New here? <a href="#" id="toSignup">Create an account</a>`
          : `Already have an account? <a href="#" id="toLogin">Log in</a>`}
      </div>
      ${state.authMode==='signup' ? `<div style="margin-top:10px; font-size:12px; color:var(--muted);">After signing up, an admin needs to assign you to a territory before you can see any customers.</div>` : ''}
    </div>
  </main>`;
}
function bindAuthEvents(){
  const submitBtn = document.getElementById('authSubmitBtn');
  if(submitBtn){
    submitBtn.onclick = () => {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if(!email || !password){ state.authError = 'Enter an email and password.'; render(); return; }
      if(state.authMode==='login') doLogin(email, password);
      else doSignUp(email, password);
    };
  }
  const toSignup = document.getElementById('toSignup');
  if(toSignup){ toSignup.onclick = (e) => { e.preventDefault(); state.authMode='signup'; state.authError=null; render(); }; }
  const toLogin = document.getElementById('toLogin');
  if(toLogin){ toLogin.onclick = (e) => { e.preventDefault(); state.authMode='login'; state.authError=null; render(); }; }
}

function bindHeaderEvents(){
  const btn = document.getElementById('signOutBtn');
  if(btn){ btn.onclick = doSignOut; }
  const editBtn = document.getElementById('editNameBtn');
  if(editBtn){
    editBtn.onclick = async () => {
      const current = state.profile.display_name || '';
      const name = prompt('Your display name (shown instead of your email):', current);
      if(name === null) return;
      const trimmed = name.trim();
      const { error } = await sb.rpc('update_my_display_name', { new_name: trimmed || null });
      if(error){ showToast('Could not save: ' + error.message); return; }
      state.profile.display_name = trimmed || null;
      render();
      showToast('Name updated');
    };
  }
}

function navHtml(){
  return `
  <nav>
    <button data-view="customers" class="${state.view==='customers'?'active':''}">Customers</button>
    <button data-view="folders" class="${state.view==='folders'?'active':''}">Folders</button>
    <button data-view="followups" class="${state.view==='followups'?'active':''}">Follow-Ups</button>
    ${isAdmin() ? `<button data-view="team" class="${state.view==='team'?'active':''}">Team</button>` : ''}
  </nav>`;
}

function teamViewHtml(){
  return `
  <main>
    <div class="toolbar">
      <div style="font-size:13.5px; color:var(--muted); flex:1;">Assign territories and roles to your team.</div>
      <button class="btn amber" id="newTerritoryBtn">+ New Territory</button>
    </div>
    <div class="card" style="padding:16px; margin-bottom:16px;">
      <div class="section-title">Territories</div>
      ${state.territories.map(t=>`<span class="tag" style="font-size:12px; padding:4px 10px;">${esc(t.name)}</span>`).join(' ') || '<span style="color:var(--muted); font-size:13px;">None yet.</span>'}
    </div>
    <div class="card">
      ${state.profilesList.length===0 ? `<div class="empty">No team members yet.</div>` :
      state.profilesList.map(p => `
        <div class="followup-row">
          <div>
            <div class="co">${esc(p.display_name || p.email)}</div>
            <div class="snippet">${esc(p.email)} · ${p.role==='admin' ? 'Admin' : territoryNameFor(p.territory_id)}</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input data-name-input="${p.id}" placeholder="Display name" value="${esc(p.display_name)}" style="padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; width:120px;">
            <select data-role-sel="${p.id}">
              <option value="user" ${p.role==='user'?'selected':''}>User</option>
              <option value="admin" ${p.role==='admin'?'selected':''}>Admin</option>
            </select>
            <select data-territory-sel="${p.id}">
              <option value="">— none —</option>
              ${state.territories.map(t=>`<option value="${t.id}" ${p.territory_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
            </select>
            <button class="btn small" data-save-profile="${p.id}">Save</button>
          </div>
        </div>`).join('')}
    </div>
  </main>`;
}

function foldersViewHtml(){
  const folders = allFolders();
  const noFolderCount = state.customers.filter(c=>!c.folder).length;
  return `
  <main>
    <div class="toolbar">
      <div style="font-size:13.5px; color:var(--muted); flex:1;">Tap a folder to see the customers inside it.</div>
      <button class="btn amber" id="newFolderBtn">+ New Folder</button>
    </div>
    <div class="card list" style="max-height:none;">
      ${folders.length===0 && noFolderCount===0 ? `<div class="empty">No folders yet.</div>` : `
        ${folders.map(f => `
          <div class="cust-item" data-folder="${esc(f)}" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div class="name">${esc(f)}</div>
              <div class="addr">${state.customers.filter(c=>c.folder===f).length} customer(s)</div>
            </div>
            <button class="btn ghost small" data-del-folder="${esc(f)}" style="padding:2px 8px;">✕</button>
          </div>`).join('')}
        ${noFolderCount>0 ? `
          <div class="cust-item" data-folder="">
            <div class="name">No Folder</div>
            <div class="addr">${noFolderCount} customer(s)</div>
          </div>` : ''}
      `}
    </div>
  </main>`;
}

function customersViewHtml(){
  const list = filteredCustomers();
  const sel = state.customers.find(c=>c.id===state.selectedId);
  return `
  <main>
    <div class="toolbar">
      <div style="position:relative; flex:1; min-width:220px;">
        <input id="searchInput" type="text" placeholder="Search company, address, contact, or note text…" value="${esc(state.search)}" style="width:100%; padding-right:${state.search?'32px':'10px'};">
        ${state.search ? `<button id="clearSearchBtn" type="button" aria-label="Clear search" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:4px 8px;">✕</button>` : ''}
      </div>
      <button class="btn amber" id="newCustomerBtn">+ New Customer</button>
    </div>
    ${state.folderFilter!=='ALL' ? `<div class="folder-chips"><span class="folder-chip active" data-folder="ALL">Folder: ${esc(state.folderFilter||'No Folder')} — tap to clear</span></div>` : ''}
    <div class="layout ${sel ? 'has-selection' : ''}">
      <div class="card list">
        ${list.length===0 ? `<div class="empty">No customers yet.<br>Add your first one to get started.</div>` :
          list.map(c => `
            <div class="cust-item ${c.id===state.selectedId?'sel':''}" data-id="${c.id}">
              <div class="name">${esc(c.company||'(no company name)')}</div>
              <div class="addr">${esc([c.street,c.city,c.province].filter(Boolean).join(', '))}</div>
              <div>
                <span class="tag">${esc(territoryNameFor(c.territory_id))}</span>
                ${c.folder ? `<span class="tag">${esc(c.folder)}</span>` : ''}
              </div>
            </div>`).join('')}
      </div>
      <div class="card">
        ${sel ? customerDetailHtml(sel) : `<div class="empty">Select a customer on the left, or add a new one.</div>`}
      </div>
    </div>
  </main>`;
}

function customerDetailHtml(c){
  const notes = notesFor(c.id);
  const estimates = estimatesFor(c.id);
  const contacts = contactsFor(c.id);
  return `
  <div class="detail">
    <button class="btn ghost small back-to-list" id="backToListBtn">← Back to list</button>
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h2>${esc(c.company||'(no company name)')}</h2>
        <div class="addr-line">
          ${esc([c.street, c.city, c.province, c.postal_code].filter(Boolean).join(', ')) || 'No address on file'}
          ${(c.street || c.city) ? ` · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([c.street, c.city, c.province, c.postal_code].filter(Boolean).join(', '))}" target="_blank" rel="noopener">View on Google Maps</a>` : ''}
        </div>
      </div>
      <div class="row-actions">
        <button class="btn ghost small" data-share-cust="${c.id}">Share</button>
        <button class="btn ghost small" data-edit-cust="${c.id}">Edit</button>
        <button class="btn danger small" data-del-cust="${c.id}">Delete</button>
      </div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <div>
        <span class="tag">${esc(territoryNameFor(c.territory_id))}</span>
        ${c.folder ? `<span class="tag">${esc(c.folder)}</span>` : ''}
      </div>
      <div><strong>Existing sign size:</strong> ${esc(c.size_of_existing_sign)||'—'}</div>
    </div>
    <div class="row-actions" style="align-items:center; margin-bottom:14px;">
      <label style="font-size:12px; color:var(--muted); font-weight:600;">Folder:</label>
      <select id="folderAssignSel" style="padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;">
        <option value="">— none —</option>
        ${allFolders().map(f=>`<option value="${esc(f)}" ${c.folder===f?'selected':''}>${esc(f)}</option>`).join('')}
        <option value="__new__">+ New folder…</option>
      </select>
      <button class="btn small" id="assignFolderBtn" data-cust="${c.id}">Add to Folder</button>
    </div>

    <div class="section-title">Contacts</div>
    ${contacts.length===0 ? `<div class="empty" style="padding:14px;">No contacts added yet.</div>` :
      contacts.map(ct => `
        <div class="contact-card">
          <div>
            <div class="cname">${esc(ct.name)||'(no name)'}</div>
            <div class="clinks">
              ${ct.phone ? `<a href="tel:${telHref(ct.phone)}">Call ${esc(ct.phone)}</a>` : ''}
              ${ct.phone ? `<a href="sms:${telHref(ct.phone)}">Text</a>` : ''}
              ${ct.email ? `<span class="clinks-email" data-copy-email="${esc(ct.email)}" style="cursor:pointer; background:#eef1f5; padding:3px 8px; border-radius:6px; font-size:12px; color:var(--navy);">${esc(ct.email)}</span>` : ''}
            </div>
          </div>
          <button class="btn ghost small" data-del-contact="${ct.id}" style="padding:2px 8px;">✕</button>
        </div>`).join('')}
    <div class="add-contact">
      <div class="field" style="flex:1; min-width:120px;"><label>Name</label><input id="c_name" placeholder="Name"></div>
      <div class="field" style="flex:1; min-width:120px;"><label>Phone</label><input id="c_phone" placeholder="Phone" class="mono"></div>
      <div class="field" style="flex:1; min-width:140px;"><label>Email</label><input id="c_email" placeholder="Email"></div>
      <button class="btn small" id="addContactBtn" data-cust="${c.id}">+ Add Contact</button>
    </div>

    <div class="section-title">Add an estimate</div>
    <div class="newnote">
      <textarea id="estimateText" placeholder="Estimate details, sign specs, pricing…"></textarea>
      <div class="row">
        <label class="mono" style="font-size:11.5px;">Date of estimate
          <input type="date" id="estimateDate" value="${todayStr()}">
        </label>
        <label style="font-size:12px;">Photo(s)
          <input type="file" id="estimatePhotos" accept="image/*" multiple>
        </label>
        <button class="btn" id="saveEstimateBtn" data-cust="${c.id}">Save Estimate</button>
      </div>
    </div>

    <div class="section-title">Estimates (${estimates.length})</div>
    ${estimates.length===0 ? `<div class="empty">No estimates yet for this customer.</div>` :
      estimates.map(e => estimateHtml(e)).join('')}

    <div class="section-title">Add a note</div>
    <div class="newnote">
      <textarea id="noteText" placeholder="What did you discuss? Reader board condition, pricing, next steps…"></textarea>
      <div class="row">
        <label class="mono" style="font-size:11.5px;">Date of note
          <input type="date" id="noteDate" value="${todayStr()}">
        </label>
        <label class="mono" style="font-size:11.5px;">Follow up on
          <input type="date" id="noteFollowUp">
        </label>
        <label style="font-size:12px;">Reader board photo(s)
          <input type="file" id="notePhotos" accept="image/*" multiple>
        </label>
        <button class="btn" id="saveNoteBtn" data-cust="${c.id}">Save Note</button>
      </div>
    </div>

    <div class="section-title">History (${notes.length})</div>
    ${notes.length===0 ? `<div class="empty">No notes yet for this customer.</div>` :
      notes.map(n => noteHtml(n, c.company)).join('')}
  </div>`;
}

function followUpBadge(followUpDate){
  if(!followUpDate) return '';
  const d = daysUntil(followUpDate);
  let cls = 'upcoming', label = `Follow up ${fmtDate(followUpDate)}`;
  if(d < 0){ cls='overdue'; label = `Overdue — was due ${fmtDate(followUpDate)}`; }
  else if(d === 0){ cls='overdue'; label = `Due today`; }
  else if(d <= 3){ cls='upcoming'; label = `Due in ${d}d — ${fmtDate(followUpDate)}`; }
  else { cls='done'; label = `Follow up ${fmtDate(followUpDate)}`; }
  return `<span class="badge ${cls}">${label}</span>`;
}

function noteHtml(n, companyName){
  return `
  <div class="note">
    <div class="meta">
      <span>${fmtDate(n.date_of_note)} · <strong>${esc(n.created_by||'Unknown')}</strong></span>
      <span style="display:flex; gap:8px; align-items:center;">
        ${followUpBadge(n.follow_up_date)}
        <button class="btn ghost small" data-del-note="${n.id}" style="padding:2px 8px;">✕</button>
      </span>
    </div>
    <div class="text">${esc(n.note_text)}</div>
    ${n.photos && n.photos.length ? `<div class="photos">${n.photos.map(p=>`<img src="${p}" data-lightbox="${p}">`).join('')}</div>` : ''}
  </div>`;
}

function estimateHtml(e){
  return `
  <div class="note">
    <div class="meta">
      <span>${fmtDate(e.date_of_estimate)} · <strong>${esc(e.created_by||'Unknown')}</strong></span>
      <button class="btn ghost small" data-del-estimate="${e.id}" style="padding:2px 8px;">✕</button>
    </div>
    <div class="text">${esc(e.estimate_text)}</div>
    ${e.photos && e.photos.length ? `<div class="photos">${e.photos.map(p=>`<img src="${p}" data-lightbox="${p}">`).join('')}</div>` : ''}
  </div>`;
}

function followupsViewHtml(){
  const items = allFollowUps();
  return `
  <main>
    <div class="toolbar">
      <div style="font-size:13.5px; color:var(--muted);">Every note with a follow-up date, soonest first.</div>
    </div>
    <div class="card">
      ${items.length===0 ? `<div class="empty">No follow-ups scheduled.</div>` :
        items.map(({note,cust}) => `
        <div class="followup-row">
          <div class="co" data-goto-cust="${cust.id}" style="cursor:pointer;">${esc(cust.company||'(no company name)')}</div>
          <div style="flex-shrink:0;">${followUpBadge(note.follow_up_date)}</div>
        </div>`).join('')}
    </div>
  </main>`;
}

function modalsHtml(){
  if(state.addingCustomer) return customerFormModal(null);
  if(state.editingCustomer) return customerFormModal(state.customers.find(c=>c.id===state.selectedId));
  if(state.addingFolder) return folderFormModal();
  return '';
}

function customerFormModal(existing){
  const c = existing || {};
  return `
  <div class="modal-bg" id="custModalBg">
    <div class="modal">
      <h3>${existing ? 'Edit Customer' : 'New Customer'}</h3>
      <div class="grid2">
        <div class="field"><label>Company</label><input id="f_company" value="${esc(c.company)}"></div>
        <div class="field"><label>Street</label><input id="f_street" value="${esc(c.street)}"></div>
        <div class="field"><label>City</label><input id="f_city" value="${esc(c.city)}"></div>
        <div class="field"><label>Province</label><input id="f_province" value="${esc(c.province)}"></div>
        <div class="field"><label>Postal Code</label><input id="f_postal" class="mono" value="${esc(c.postal_code)}"></div>
        <div class="field"><label>Size of Existing Sign</label><input id="f_size" value="${esc(c.size_of_existing_sign)}"></div>
        ${isAdmin() ? `
        <div class="field"><label>Territory</label>
          <select id="f_territory">
            ${state.territories.map(t=>`<option value="${t.id}" ${c.territory_id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
        </div>` : ''}
      </div>
      <div class="row-actions" style="justify-content:flex-end; margin-top:14px;">
        <button class="btn ghost" id="cancelCustModal">Cancel</button>
        <button class="btn amber" id="saveCustModal" data-existing="${existing ? existing.id : ''}">Save</button>
      </div>
    </div>
  </div>`;
}

function folderFormModal(){
  return `
  <div class="modal-bg" id="folderModalBg">
    <div class="modal">
      <h3>New Folder</h3>
      <div class="field" style="margin-bottom:10px;"><label>Name</label><input id="folder_name"></div>
      ${isAdmin() ? `
      <div class="field"><label>Territory</label>
        <select id="folder_territory">
          ${state.territories.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="row-actions" style="justify-content:flex-end; margin-top:14px;">
        <button class="btn ghost" id="cancelFolderModal">Cancel</button>
        <button class="btn amber" id="saveFolderModal">Create</button>
      </div>
    </div>
  </div>`;
}

// ---------- events ----------
function bindEvents(){
  bindHeaderEvents();

  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick = () => { state.view = b.dataset.view; render(); };
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = e => {
      const pos = e.target.selectionStart;
      state.search = e.target.value;
      render();
      const freshInput = document.getElementById('searchInput');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(pos, pos); }
    };
  }
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  if(clearSearchBtn){
    clearSearchBtn.onclick = () => {
      state.search = '';
      render();
      const freshInput = document.getElementById('searchInput');
      if(freshInput) freshInput.focus();
    };
  }
  document.querySelectorAll('.folder-chip').forEach(el=>{
    el.onclick = () => { state.folderFilter = el.dataset.folder; render(); };
  });
  const newFolderBtn = document.getElementById('newFolderBtn');
  if(newFolderBtn){ newFolderBtn.onclick = () => { state.addingFolder = true; render(); }; }

  const cancelFolderBtn = document.getElementById('cancelFolderModal');
  if(cancelFolderBtn){ cancelFolderBtn.onclick = () => { state.addingFolder = false; render(); }; }
  const saveFolderBtn = document.getElementById('saveFolderModal');
  if(saveFolderBtn){
    saveFolderBtn.onclick = async () => {
      const name = document.getElementById('folder_name').value.trim();
      if(!name){ showToast('Enter a folder name'); return; }
      const territory_id = isAdmin() ? document.getElementById('folder_territory').value : state.profile.territory_id;
      const { data, error } = await sb.from('folders').insert([{ name, territory_id }]).select();
      if(error){ showToast('Could not create: ' + error.message); return; }
      state.folders.push(data[0]);
      state.addingFolder = false;
      render();
      showToast('Folder created');
    };
  }

  const assignFolderBtn = document.getElementById('assignFolderBtn');
  if(assignFolderBtn){
    assignFolderBtn.onclick = async () => {
      const sel = document.getElementById('folderAssignSel');
      let val = sel.value;
      const cust = state.customers.find(c=>c.id===assignFolderBtn.dataset.cust);
      if(val === '__new__'){
        val = (prompt('New folder name:') || '').trim();
        if(!val) return;
      }
      if(val && cust) await ensureFolderExists(val, cust.territory_id);
      await updateCustomer(assignFolderBtn.dataset.cust, { folder: val || null });
    };
  }

  const newBtn = document.getElementById('newCustomerBtn');
  if(newBtn){ newBtn.onclick = () => { state.addingCustomer = true; render(); }; }

  document.querySelectorAll('.cust-item[data-id]').forEach(el=>{
    el.onclick = () => { state.selectedId = el.dataset.id; render(); };
  });
  document.querySelectorAll('.cust-item[data-folder]').forEach(el=>{
    el.onclick = () => { state.folderFilter = el.dataset.folder; state.view = 'customers'; state.selectedId = null; render(); };
  });
  document.querySelectorAll('[data-del-folder]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm(`Delete the "${el.dataset.delFolder}" folder? Customers inside it will not be deleted, just unassigned from it.`)){
        deleteFolder(el.dataset.delFolder);
      }
    };
  });

  const backToListBtn = document.getElementById('backToListBtn');
  if(backToListBtn){ backToListBtn.onclick = () => { state.selectedId = null; render(); }; }

  document.querySelectorAll('[data-share-cust]').forEach(el=>{
    el.onclick = async (e) => {
      e.stopPropagation();
      const c = state.customers.find(c=>c.id===el.dataset.shareCust);
      if(!c) return;
      const notes = notesFor(c.id);
      const latest = notes[0];
      const lines = [
        c.company || '(no company name)',
        [c.street, c.city, c.province, c.postal_code].filter(Boolean).join(', '),
      ];
      if(latest){
        lines.push('');
        lines.push(`Latest note (${fmtDate(latest.date_of_note)}): ${latest.note_text}`);
        if(latest.follow_up_date) lines.push(`Follow up: ${fmtDate(latest.follow_up_date)}`);
      }
      const shareText = lines.join('\n');
      if(navigator.share){
        try{ await navigator.share({ title: c.company || 'Customer', text: shareText }); }
        catch(err){ /* cancelled */ }
      } else {
        try{ await navigator.clipboard.writeText(shareText); showToast('Copied — paste it into a text, email, etc.'); }
        catch(err){ showToast('Could not share automatically'); }
      }
    };
  });
  document.querySelectorAll('[data-edit-cust]').forEach(el=>{
    el.onclick = (e) => { e.stopPropagation(); state.editingCustomer = true; render(); };
  });
  document.querySelectorAll('[data-del-cust]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Delete this customer, their contacts, and all their notes? This cannot be undone.')){
        deleteCustomer(el.dataset.delCust);
      }
    };
  });
  document.querySelectorAll('[data-goto-cust]').forEach(el=>{
    el.onclick = () => { state.view='customers'; state.selectedId = el.dataset.gotoCust; render(); };
  });
  document.querySelectorAll('[data-del-note]').forEach(el=>{
    el.onclick = () => { if(confirm('Delete this note?')) deleteNote(el.dataset.delNote); };
  });
  document.querySelectorAll('[data-del-estimate]').forEach(el=>{
    el.onclick = () => { if(confirm('Delete this estimate?')) deleteEstimate(el.dataset.delEstimate); };
  });
  document.querySelectorAll('[data-del-contact]').forEach(el=>{
    el.onclick = () => { if(confirm('Remove this contact?')) deleteContact(el.dataset.delContact); };
  });
  document.querySelectorAll('[data-copy-email]').forEach(el=>{
    el.onclick = async () => {
      try{ await navigator.clipboard.writeText(el.dataset.copyEmail); showToast('Email copied'); }
      catch(e){ showToast('Could not copy automatically'); }
    };
  });
  document.querySelectorAll('[data-lightbox]').forEach(el=>{
    el.onclick = () => { state.lightboxSrc = el.dataset.lightbox; render(); };
  });
  const lb = document.getElementById('lightbox');
  if(lb){ lb.onclick = () => { state.lightboxSrc = null; render(); }; }

  const addContactBtn = document.getElementById('addContactBtn');
  if(addContactBtn){
    addContactBtn.onclick = async () => {
      const name = document.getElementById('c_name').value.trim();
      const phone = document.getElementById('c_phone').value.trim();
      const email = document.getElementById('c_email').value.trim();
      if(!name && !phone && !email){ showToast('Add at least a name, phone, or email'); return; }
      await addContact(addContactBtn.dataset.cust, { name, phone, email });
    };
  }

  const saveNoteBtn = document.getElementById('saveNoteBtn');
  if(saveNoteBtn){
    saveNoteBtn.onclick = async () => {
      const custId = saveNoteBtn.dataset.cust;
      const note_text = document.getElementById('noteText').value.trim();
      const date_of_note = document.getElementById('noteDate').value || todayStr();
      const follow_up_date = document.getElementById('noteFollowUp').value || null;
      const files = document.getElementById('notePhotos').files;
      if(!note_text){ showToast('Write a note first'); return; }
      saveNoteBtn.disabled = true; saveNoteBtn.textContent = 'Saving…';
      let photos = [];
      try{
        for(const f of files){
          const blob = await compressToBlob(f);
          const url = await uploadPhoto(custId, blob);
          photos.push(url);
        }
      }catch(e){ showToast('Some photo(s) failed to upload, saving note anyway'); }
      await addNote(custId, { note_text, date_of_note, follow_up_date, photos });
    };
  }

  const saveEstimateBtn = document.getElementById('saveEstimateBtn');
  if(saveEstimateBtn){
    saveEstimateBtn.onclick = async () => {
      const custId = saveEstimateBtn.dataset.cust;
      const estimate_text = document.getElementById('estimateText').value.trim();
      const date_of_estimate = document.getElementById('estimateDate').value || todayStr();
      const files = document.getElementById('estimatePhotos').files;
      if(!estimate_text){ showToast('Write an estimate first'); return; }
      saveEstimateBtn.disabled = true; saveEstimateBtn.textContent = 'Saving…';
      let photos = [];
      try{
        for(const f of files){
          const blob = await compressToBlob(f);
          const url = await uploadPhoto(custId, blob);
          photos.push(url);
        }
      }catch(e){ showToast('Some photo(s) failed to upload, saving estimate anyway'); }
      await addEstimate(custId, { estimate_text, date_of_estimate, photos });
    };
  }

  const cancelBtn = document.getElementById('cancelCustModal');
  if(cancelBtn){ cancelBtn.onclick = () => { state.addingCustomer=false; state.editingCustomer=false; render(); }; }
  const saveCustBtn = document.getElementById('saveCustModal');
  if(saveCustBtn){
    saveCustBtn.onclick = async () => {
      const data = {
        company: document.getElementById('f_company').value.trim(),
        street: document.getElementById('f_street').value.trim(),
        city: document.getElementById('f_city').value.trim(),
        province: document.getElementById('f_province').value.trim(),
        postal_code: document.getElementById('f_postal').value.trim(),
        size_of_existing_sign: document.getElementById('f_size').value.trim(),
      };
      if(!data.company){ showToast('Company name is required'); return; }
      if(isAdmin()){
        data.territory_id = document.getElementById('f_territory').value;
      } else {
        data.territory_id = state.profile.territory_id;
      }
      const existingId = saveCustBtn.dataset.existing;
      if(existingId){ await updateCustomer(existingId, data); }
      else{ await addCustomer(data); }
    };
  }

  const newTerritoryBtn = document.getElementById('newTerritoryBtn');
  if(newTerritoryBtn){
    newTerritoryBtn.onclick = async () => {
      const name = (prompt('Territory name:') || '').trim();
      if(!name) return;
      const { data, error } = await sb.from('territories').insert([{ name }]).select();
      if(error){ showToast('Could not create: ' + error.message); return; }
      state.territories.push(data[0]);
      render();
      showToast('Territory created');
    };
  }
  document.querySelectorAll('[data-save-profile]').forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.saveProfile;
      const role = document.querySelector(`[data-role-sel="${id}"]`).value;
      const territoryRaw = document.querySelector(`[data-territory-sel="${id}"]`).value;
      const display_name = document.querySelector(`[data-name-input="${id}"]`).value.trim() || null;
      saveProfile(id, { role, territory_id: territoryRaw || null, display_name });
    };
  });
}

boot();
</script>
