// ---------- pulling the right information out of the customer record ----------
function letterPrimaryContact(custId){
  const cs = contactsFor(custId).filter(ct => (ct.name || '').trim());
  cs.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  return cs[0] || null;
}
// size text for a letter: whole feet when it works out evenly (8' x 4'), otherwise whole inches (92" x 48")
function formatSizeText(wIn, hIn){
  const feet = v => Math.abs(v / 12 - Math.round(v / 12)) < 0.005 && v >= 12;
  if(feet(wIn) && feet(hIn)) return Math.round(wIn / 12) + "' x " + Math.round(hIn / 12) + "'";
  return Math.round(wIn) + '" x ' + Math.round(hIn) + '"';
}
// everything the Estimate Calculator wrote into the customer's most recent saved estimate (price, existing size, new size)
function savedEstimateDetails(custId){
  // newest first: by estimate date, and when two were saved on the same day, the one saved last
  const ordered = state.estimates.filter(e => e.customer_id === custId).map((e, i) => ({ e, i }))
    .sort((a, b) => (b.e.date_of_estimate || '').localeCompare(a.e.date_of_estimate || '') || (b.e.created_at || '').localeCompare(a.e.created_at || '') || b.i - a.i)
    .map(x => x.e);
  for(const e of ordered){
    const t = e.estimate_text || '';
    const pm = /Price:\s*\$\s*([\d,]+(?:\.\d+)?)/i.exec(t);
    if(!pm) continue;                                   // not a calculator estimate (just a typed note)
    const ex = /Existing sign:[^\n]*?([\d.]+)"\s*[\u00d7x]\s*([\d.]+)"/i.exec(t);
    const nw = /New sign size, frame included:\s*([\d.]+)"\s*[\u00d7x]\s*([\d.]+)"/i.exec(t);
    return {
      price: pm[1].replace(/,/g, ''),
      existing: ex ? formatSizeText(parseFloat(ex[1]), parseFloat(ex[2])) : '',
      proposed: nw ? formatSizeText(parseFloat(nw[1]), parseFloat(nw[2])) + (/double sided/i.test(t) ? ' (double-sided)' : '') : '',
    };
  }
  return { price: '', existing: '', proposed: '' };
}
function priceNumber(str){
  const m = /[\d,]*\.?\d+/.exec(String(str || '').replace(/\s/g, ''));
  const n = m ? parseFloat(m[0].replace(/,/g, '')) : NaN;
  return n > 0 ? n : 0;
}
function formatPrice(n){
  return '$' + (Number.isInteger(n) ? n.toLocaleString('en-CA') : n.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
}
function letterProvince(p){
  const s = (p || '').trim();
  if(!s) return 'ON';                          // every customer so far is in Ontario
  if(/^ontario$/i.test(s)) return 'ON';
  return s.length <= 3 ? s.toUpperCase() : s;
}
function letterPostal(p){
  const s = (p || '').toUpperCase().replace(/\s+/g, '');
  return /^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(s) ? s.slice(0, 3) + ' ' + s.slice(3) : (p || '').trim().toUpperCase();
}
function buildLetterRow(c, key){
  const ct = letterPrimaryContact(c.id);
  const org = (c.company || '').trim();
  const det = savedEstimateDetails(c.id), fields = LETTER_TEMPLATES[key].fields || [];
  const row = {
    id: c.id, org,
    contactName: ct ? ct.name.trim() : '',
    salutation: ct ? ct.name.trim() : (org ? org + ' Team' : ''),
    street: (c.street || '').trim(), city: (c.city || '').trim(), prov: letterProvince(c.province), postal: letterPostal(c.postal_code),
    price: fields.includes('price') ? det.price : '',
    existing: fields.includes('existing') ? det.existing : '',
    proposed: fields.includes('proposed') ? det.proposed : '',
    checked: false,
  };
  row.fromEstimate = !!(row.price || row.existing || row.proposed);
  return row;
}
function letterProblems(row, key){
  const p = [];
  if(!row.org) p.push('no customer name');
  const fields = LETTER_TEMPLATES[key].fields || [];
  if(fields.includes('existing') && !(row.existing || '').trim()) p.push('needs the existing board size');
  if(fields.includes('proposed') && !(row.proposed || '').trim()) p.push('needs the proposed board size');
  if(fields.includes('price') && !priceNumber(row.price)) p.push('needs a price');
  return p;
}
function envelopeProblems(row){
  const p = [];
  if(!row.street) p.push('no street');
  if(!row.city) p.push('no city');
  if(!row.postal) p.push('no postal code');

}
function addressLines(row){
  return [row.contactName, row.org, row.street, [row.city, row.prov].filter(Boolean).join(', ') + (row.postal ? '  ' + row.postal : '')].filter(l => l && l.trim());
}
function mergeLetterText(text, row){
  return text.replace(/\{(org|price|existing|proposed|phone|website)\}/g, (m, k) => {
    if(k === 'org') return row.org;
    if(k === 'existing') return (row.existing || '').trim();
    if(k === 'proposed') return (row.proposed || '').trim();
    if(k === 'price') return formatPrice(priceNumber(row.price));
    if(k === 'phone') return LETTER_SETTINGS.phone;
    return LETTER_SETTINGS.website;
  });
}
function letterDateText(d){
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

// ---------- the PDFs ----------
function makeLettersPdf(key, rows){
  const jsPDF = window.jspdf.jsPDF, tpl = LETTER_TEMPLATES[key], S = LETTER_SETTINGS;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const H = 792, M = 72, TEXT_W = 612 - 2 * M, LH = 14.5, GAP = 9;
  const today = letterDateText(new Date());
  rows.forEach((row, i) => {
    if(i > 0) doc.addPage();
    let y = M;
    doc.setFontSize(11);
    const need = h => { if(y + h > H - M){ doc.addPage(); y = M; } };
    const line = (txt, x, bold) => { need(LH); doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(txt, x, y); y += LH; };
    const para = (txt, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.splitTextToSize(txt, TEXT_W).forEach(l => line(l, M, bold)); y += GAP - 4; };
    line(today, M); y += GAP;
    addressLines(row).forEach(l => line(l, M)); y += GAP;
    para('RE: ' + mergeLetterText(tpl.re, row), true);
    para('Dear ' + row.salutation + ',');
    tpl.blocks.forEach(b => {
      if(b.t === 'p') para(mergeLetterText(b.text, row));
      else if(b.t === 'b') para(mergeLetterText(b.text, row), true);
      else if(b.t === 'kv'){
        b.items.forEach(([label, val]) => {
          need(LH);
          doc.setFont('helvetica', 'bold'); doc.text(label + ':', M + 8, y);
          const lw = doc.getTextWidth(label + ': ');
          doc.setFont('helvetica', 'normal'); doc.text(mergeLetterText(val, row), M + 8 + lw, y);
          y += LH;
        });
        y += GAP - 4;
      }
      else if(b.t === 'ul'){
        b.items.forEach(it => {
          doc.setFont('helvetica', 'normal');
          doc.splitTextToSize(mergeLetterText(it, row), TEXT_W - 26).forEach((l, k) => { need(LH); if(k === 0) doc.text('\u2022', M + 8, y); doc.text(l, M + 24, y); y += LH; });
        });
        y += GAP - 4;
      }
    });
    need(LH * 8);
    line('Warm regards,', M); y += 30;
    line(S.senderName, M, true); line(S.senderTitle, M); line(S.company, M);
    line([S.phone, S.website].filter(Boolean).join('  |  '), M);
  });
  return doc;
}
function makeEnvelopesPdf(rows){      // standard #10 business envelope: 9.5" x 4.125", printed sideways
  const jsPDF = window.jspdf.jsPDF, S = LETTER_SETTINGS;
  const W = 684, H = 297;
  const doc = new jsPDF({ unit: 'pt', format: [W, H], orientation: 'landscape' });
  rows.forEach((row, i) => {
    if(i > 0) doc.addPage([W, H], 'landscape');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    (S.returnAddress.length ? S.returnAddress : [S.company]).forEach((l, j) => doc.text(l, 36, 42 + j * 11));
    const lines = [row.contactName, row.org, row.street, [row.city.toUpperCase(), row.prov].filter(Boolean).join(' ') + (row.postal ? '  ' + row.postal : '')]
      .filter(l => l && l.trim()).map(l => l.toUpperCase());            // all capitals is what Canada Post's sorting machines read best
    doc.setFontSize(12);
    let y = 128;
    lines.forEach(l => doc.splitTextToSize(l, 330).forEach(w => { doc.text(w, 288, y); y += 15; }));
  });
  return doc;
}
function downloadPdf(doc, filename){
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---------- the print dialog ----------
function openPrintDialog(key, onlyCustId){
  const tpl = LETTER_TEMPLATES[key];
  if(!tpl) return;
  const customers = onlyCustId ? state.customers.filter(c => c.id === onlyCustId) : listCustomers(key);
  const rows = customers.map(c => {
    const r = buildLetterRow(c, key);
    r.checked = !!onlyCustId || (letterProblems(r, key).length === 0 && envelopeProblems(r).length === 0);   // only the complete ones start ticked
    return r;
  });
  state.printDlg = { key, rows, single: !!onlyCustId };
  render();
}
function printRowStatus(r, key){
  const lp = letterProblems(r, key), ep = envelopeProblems(r);
  if(!lp.length && !ep.length) return '<span style="color:var(--good, #1f7a4d);">\u2713 Ready</span>';
  return '<span style="color:#b3261e;">\u26a0 ' + [lp.length ? 'Letter: ' + lp.join(', ') : '', ep.length ? 'Envelope: ' + ep.join(', ') : ''].filter(Boolean).join(' \u00b7 ') + '</span>';
}
function printDialogHtml(){
  const d = state.printDlg, tpl = LETTER_TEMPLATES[d.key], def = listDefFor(d.key);
  return `
  <div class="modal-bg" id="printDlgBg">
    <div class="modal wide">
      <h3>Print \u2014 ${esc(def ? def.title : tpl.name)}</h3>
      <div style="font-size:12.5px; color:var(--muted); margin:-4px 0 10px;">
        Each letter is filled in from the customer's record. Tick who to include, fix anything flagged, then download. Downloading doesn't change the list \u2014 use <strong>Mark Letter Sent</strong> after they're mailed.
        ${LETTER_SETTINGS.returnAddress.length ? '' : '<br><strong>Return address not set yet</strong> \u2014 envelopes will show only \u201c' + esc(LETTER_SETTINGS.company) + '\u201d in the corner.'}
      </div>
      ${d.single ? '' : '<div style="margin:0 0 8px; font-size:13px;"><label><input type="checkbox" id="pdAll"> Tick all</label></div>'}
      ${d.rows.map((r, i) => `
        <div class="pd-row" style="display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line);">
          <div style="padding-top:2px;"><input type="checkbox" data-pd-check="${i}" ${r.checked ? 'checked' : ''}></div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700;">${esc(r.org || '(no name)')}</div>
            <div style="font-size:12.5px; color:var(--muted);">${esc(addressLines(r).slice(r.contactName ? 2 : 1).join(', ') || 'no address on file')}</div>
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; font-size:13px;">
              <label>Dear <input data-pd-sal="${i}" value="${esc(r.salutation)}" style="width:190px; padding:5px 7px; border:1px solid var(--line); border-radius:6px;"></label>
              ${(tpl.fields || []).includes('existing') ? `<label>Existing board <input data-pd-existing="${i}" value="${esc(r.existing)}" style="width:100px; padding:5px 7px; border:1px solid var(--line); border-radius:6px;"></label>` : ''}
              ${(tpl.fields || []).includes('proposed') ? `<label>Proposed board <input data-pd-proposed="${i}" value="${esc(r.proposed)}" style="width:150px; padding:5px 7px; border:1px solid var(--line); border-radius:6px;"></label>` : ''}
              ${(tpl.fields || []).includes('price') ? `<label>Price $ <input data-pd-price="${i}" value="${esc(r.price)}" inputmode="decimal" style="width:90px; padding:5px 7px; border:1px solid var(--line); border-radius:6px;"></label>` : ''}
              ${(tpl.fields || []).length ? `<span style="color:var(--muted); font-size:12px; align-self:center;">${r.fromEstimate ? 'from the saved estimate' : ''}</span>` : ''}
            </div>
            <div style="font-size:12.5px; margin-top:5px;" data-pd-status="${i}">${printRowStatus(r, d.key)}</div>
          </div>
        </div>`).join('') || '<div class="empty">Nobody to print.</div>'}
      <div id="pdMsg" style="font-size:12.5px; color:#b3261e; min-height:18px; margin-top:10px;"></div>
      <div class="row-actions" style="justify-content:flex-end; margin-top:8px; flex-wrap:wrap;">
        <button class="btn ghost" id="pdCancel">Close</button>
        <button class="btn" id="pdEnvBtn">Download Envelopes (PDF)</button>
        <button class="btn amber" id="pdLettersBtn">Download Letters (PDF)</button>
      </div>
    </div>
  </div>`;
}
function printDialogSelected(){ return state.printDlg.rows.filter(r => r.checked); }
function refreshPrintDialog(){
  const d = state.printDlg; if(!d) return;
  d.rows.forEach((r, i) => { const el = document.querySelector(`[data-pd-status="${i}"]`); if(el) el.innerHTML = printRowStatus(r, d.key); });
  const sel = printDialogSelected();
  const lProb = sel.filter(r => letterProblems(r, d.key).length), eProb = sel.filter(r => envelopeProblems(r).length);
  const lBtn = document.getElementById('pdLettersBtn'), eBtn = document.getElementById('pdEnvBtn'), msg = document.getElementById('pdMsg');
  if(lBtn) lBtn.disabled = !sel.length || lProb.length > 0;
  if(eBtn) eBtn.disabled = !sel.length || eProb.length > 0;
  const bits = [];
  if(lProb.length) bits.push('Letters blocked: ' + lProb.slice(0, 3).map(r => (r.org || '(no name)') + ' (' + letterProblems(r, d.key).join(', ') + ')').join('; ') + (lProb.length > 3 ? ' and ' + (lProb.length - 3) + ' more' : ''));
  if(eProb.length) bits.push('Envelopes blocked: ' + eProb.slice(0, 3).map(r => (r.org || '(no name)') + ' (' + envelopeProblems(r).join(', ') + ')').join('; ') + (eProb.length > 3 ? ' and ' + (eProb.length - 3) + ' more' : ''));
  if(msg) msg.textContent = bits.join('   ');
}
function bindLetterEvents(){
  document.querySelectorAll('[data-open-print]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openPrintDialog(el.dataset.openPrint, el.dataset.printCust || null); };
  });
  if(!state.printDlg) return;
  const d = state.printDlg;
  const close = () => { state.printDlg = null; render(); };
  document.getElementById('pdCancel').onclick = close;
  document.getElementById('printDlgBg').onclick = (e) => { if(e.target.id === 'printDlgBg') close(); };
  document.querySelectorAll('[data-pd-check]').forEach(el => { el.onchange = () => { d.rows[+el.dataset.pdCheck].checked = el.checked; refreshPrintDialog(); }; });
  document.querySelectorAll('[data-pd-sal]').forEach(el => { el.oninput = () => { d.rows[+el.dataset.pdSal].salutation = el.value; }; });
  document.querySelectorAll('[data-pd-price]').forEach(el => { el.oninput = () => { const r = d.rows[+el.dataset.pdPrice]; r.price = el.value; refreshPrintDialog(); }; });
  document.querySelectorAll('[data-pd-existing]').forEach(el => { el.oninput = () => { d.rows[+el.dataset.pdExisting].existing = el.value; refreshPrintDialog(); }; });
  document.querySelectorAll('[data-pd-proposed]').forEach(el => { el.oninput = () => { d.rows[+el.dataset.pdProposed].proposed = el.value; refreshPrintDialog(); }; });
  const all = document.getElementById('pdAll');
  if(all) all.onchange = () => { d.rows.forEach(r => r.checked = all.checked); document.querySelectorAll('[data-pd-check]').forEach(el => el.checked = all.checked); refreshPrintDialog(); };
  const stamp = new Date(); const ymd = stamp.getFullYear() + '-' + String(stamp.getMonth() + 1).padStart(2, '0') + '-' + String(stamp.getDate()).padStart(2, '0');
  const tpl = LETTER_TEMPLATES[d.key];
  const go = (kind) => {
    if(!window.jspdf){ showToast("The PDF tool didn't load \u2014 reload the page and try again"); return; }
    const sel = printDialogSelected();
    if(!sel.length) return;
    if(kind === 'letters'){ if(sel.some(r => letterProblems(r, d.key).length)) return; downloadPdf(makeLettersPdf(d.key, sel), tpl.name + ' Letters ' + ymd + '.pdf'); }
    else { if(sel.some(r => envelopeProblems(r).length)) return; downloadPdf(makeEnvelopesPdf(sel), tpl.name + ' Envelopes ' + ymd + '.pdf'); }
    showToast('Downloaded ' + sel.length + (kind === 'letters' ? ' letter' : ' envelope') + (sel.length === 1 ? '' : 's'));
  };
  document.getElementById('pdLettersBtn').onclick = () => go('letters');
  document.getElementById('pdEnvBtn').onclick = () => go('envelopes');
  refreshPrintDialog();
}
// ===== LETTERS: auto-filled letters + envelopes (PDF) END =====
boot();
</script>
