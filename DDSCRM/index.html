<style>
  :root{
    --ink:#1c2430;
    --muted:#6b7480;
    --paper:#f6f4ef;
    --panel:#ffffff;
    --navy:#111827;
    --navy-2:#1c2940;
    --line:#e4e0d6;
    --amber:#f2a71b;
    --amber-glow: 0 0 0 1px rgba(242,167,27,.5), 0 0 14px rgba(242,167,27,.55);
    --overdue:#d9542a;
    --overdue-glow: 0 0 0 1px rgba(217,84,42,.55), 0 0 14px rgba(217,84,42,.5);
    --good:#3f7a5c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .mono{ font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing:.02em; }

  header{
    background:linear-gradient(180deg,var(--navy),var(--navy-2));
    color:#f4f1ea;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .mark{
    width:34px;height:22px;border-radius:3px;
    background:#0b0f16;
    border:1px solid #333;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:3px;
  }
  .brand .mark span{ background:var(--amber); border-radius:1px; opacity:.85; }
  .brand .mark span:nth-child(3),.brand .mark span:nth-child(7),.brand .mark span:nth-child(10){opacity:.3;}
  .brand h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:.01em;}
  .brand .sub{ font-size:11.5px; color:#b9c2cf; margin-top:2px; }

  .who{ display:flex; align-items:center; gap:10px; font-size:13px; color:#dfe4ea;}
  .who input{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:6px; padding:6px 8px; font-size:13px; width:130px;
  }

  nav{
    display:flex; gap:2px; background:var(--navy-2); padding:0 22px;
  }
  nav button{
    background:transparent; border:none; color:#c7cedb; padding:10px 16px;
    font-size:13.5px; cursor:pointer; border-bottom:2px solid transparent; font-weight:600;
  }
  nav button.active{ color:#fff; border-bottom-color:var(--amber); }

  .toolbar{
    display:flex; gap:10px; align-items:center; padding:14px 22px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .toolbar input[type=text], .toolbar select{
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px;
    background:#fff;
  }
  .toolbar input[type=text]{ min-width:220px; flex:1; }
  .btn{
    background:var(--navy); color:#fff; border:none; padding:9px 14px;
    border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn.amber{ background:var(--amber); color:#3a2a06; }
  .btn.ghost{ background:transparent; color:var(--navy); border:1px solid var(--line); }
  .btn.small{ padding:5px 10px; font-size:12.5px; }
  .btn.danger{ background:transparent; color:var(--overdue); border:1px solid rgba(217,84,42,.4);}
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn.on{ background:var(--amber); color:#3a2a06; border:1px solid var(--amber); box-shadow:var(--amber-glow); }
  .listbar{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 6px; }
  .listbar .btn{ padding:10px 8px; font-size:13px; text-align:center; }
  .listnote{ font-size:12.5px; color:var(--muted); margin:0 0 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  @media (max-width:560px){ .listbar{ grid-template-columns:repeat(2,1fr); } }
  a.btn{ display:inline-block; text-decoration:none; }

  main{ padding:18px 22px 60px; max-width:1180px; margin:0 auto; }

  .layout{ display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }
  .back-to-list{ display:none; }
  @media (max-width:860px){
    .back-to-list{ display:inline-flex; margin-bottom:12px; }
    .layout.has-selection .list{ display:none; }
  }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .list{ max-height:74vh; overflow:auto; }
  .cust-item{
    padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .cust-item:hover{ background:#faf8f3; }
  .cust-item.sel{ background:#fdf3df; }
  .cust-item .name{ font-weight:700; font-size:14px; }
  .cust-item .addr{ font-size:12px; color:var(--muted); margin-top:2px;}
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 6px; border-radius:20px;
    background:#eef1f5; color:var(--muted); margin-top:5px; margin-right:4px; font-weight:600;
  }
  .folder-chip{
    display:inline-block; padding:6px 13px; border-radius:20px; background:#eef1f5; color:var(--navy);
    font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line);
  }
  .folder-chip.active{ background:var(--amber); color:#3a2a06; border-color:var(--amber); box-shadow:var(--amber-glow); }
  .folder-chips{ display:flex; gap:8px; flex-wrap:wrap; padding:12px 22px 0; }
  .empty{ padding:30px 16px; color:var(--muted); font-size:13.5px; text-align:center; }
  .errbox{ padding:14px 16px; background:#fdece5; color:#8a2f10; border-radius:8px; font-size:13px; margin-bottom:14px; }

  .detail{ padding:18px; }
  .detail h2{ margin:0 0 2px; font-size:19px; }
  .detail .addr-line{ color:var(--muted); font-size:13.5px; margin-bottom:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:10px 0 16px; }
  .field label{ display:block; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .field input, .field textarea{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13.5px;
    background:#fff;
  }
  .field textarea{ resize:vertical; min-height:32px; }
  .row-actions{ display:flex; gap:8px; margin-top:6px; }

  .section-title{
    font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    font-weight:700; margin:22px 0 8px; display:flex; align-items:center; justify-content:space-between;
  }

  .contact-card{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin-bottom:8px; background:#fff;
  }
  .contact-card .cname{ font-weight:700; font-size:13.5px; }
  .contact-card .clinks{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:3px; }
  .contact-card .clinks a, .contact-card .clinks span{ font-size:12px; color:var(--navy); text-decoration:none; }
  .contact-card .clinks a{ background:#eef1f5; padding:3px 8px; border-radius:6px; }
  .add-contact{ border:1px dashed var(--line); border-radius:8px; padding:10px 12px; background:#fbfaf6; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .add-contact input{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; }

  .note{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; background:#fffdf9;
  }
  .note .meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:6px; flex-wrap:wrap; gap:6px;}
  .note .text{ font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .badge{
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size:11px; padding:3px 8px; border-radius:5px; font-weight:700; letter-spacing:.03em;
  }
  .badge.upcoming{ background:#fff7e6; color:#8a5a00; box-shadow:var(--amber-glow); }
  .badge.overdue{ background:#fdece5; color:#8a2f10; box-shadow:var(--overdue-glow); }
  .badge.done{ background:#eaf3ee; color:var(--good); }
  .photos{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .photos img{ width:74px; height:74px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer; }

  .newnote{ border:1px dashed var(--line); border-radius:8px; padding:12px 14px; background:#fbfaf6; }
  .newnote textarea{ width:100%; min-height:60px; border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13.5px; font-family:inherit; }
  .newnote .row{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .newnote input[type=date]{ padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; }
  .newnote input[type=file]{ font-size:12px; }

  .followup-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .followup-row:last-child{ border-bottom:none; }
  .followup-row .co{ font-weight:700; font-size:14px; }
  .followup-row .snippet{ font-size:12.5px; color:var(--muted); margin-top:3px; max-width:520px;}

  .modal-bg{ position:fixed; inset:0; background:rgba(15,20,26,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{ background:#fff; border-radius:10px; padding:20px 22px; width:100%; max-width:520px; max-height:88vh; overflow:auto;}
  .modal h3{ margin-top:0; }
  .modal.wide{ max-width:760px; }
  .lightbox{ position:fixed; inset:0; background:rgba(10,12,16,.85); display:flex; align-items:center; justify-content:center; z-index:60; cursor:zoom-out;}
  .lightbox img{ max-width:90vw; max-height:90vh; border-radius:6px; }

  .toast{
    position:fixed; bottom:18px; right:18px; background:var(--navy); color:#fff; padding:10px 16px;
    border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:70;
  }
  .loading{ text-align:center; color:var(--muted); padding:40px; font-size:13.5px; }
  .imp-table{ border-collapse:collapse; font-size:12.5px; width:100%; }
  .imp-table th{ padding:6px; background:#f3f1ea; border:1px solid var(--line); vertical-align:top; text-align:left; }
  .imp-table th select{ width:100%; min-width:140px; padding:5px; font-size:12px; }
  .imp-table td{ padding:5px 8px; border:1px solid var(--line); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav{ overflow-x:auto; }
  nav button{ flex-shrink:0; white-space:nowrap; }
</style>
</head>

<script>
/* =========================================================
   CONFIG — Supabase project
   ========================================================= */
const SUPABASE_URL = "https://nlahmlqtzgscxllzopua.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sYWhtbHF0emdzY3hsbHpvcHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzM2ODgsImV4cCI6MjA5OTQ0OTY4OH0.pmT48FdVOkKhBUto7Il1j4LeQ_j_o_XkLWyFl6qlltg";
const PHOTO_BUCKET = "reader-board-photos";
/* ========================================================= */

const sb = (typeof window.supabase !== 'undefined') ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const configured = !!sb && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
const libraryFailedToLoad = typeof window.supabase === 'undefined';

const state = {
  session: null,
  profile: null,
  profilesList: [],
  territories: [],
  authMode: 'login',
  authError: null,
  authBusy: false,
  bootLoading: true,
  passwordRecovery: false,

  customers: [],
  notes: [],
  estimates: [],
  contacts: [],
  folders: [],
  view: 'customers',
  selectedId: null,
  search: '',
  folderFilter: 'ALL',
  loading: true,
  error: null,
  toast: null,
  lightboxSrc: null,
  addingCustomer: false,
  editingCustomer: false,
  addingFolder: false,
  lpList: 'go_measure',
  listScroll: 0,   // how far the customer list was scrolled (kept while the list is hidden behind a customer on a phone)
  listScrollReset: false,
  printDlg: null,   // the Print Letters & Envelopes dialog, when open
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function splitPhoneExt(phone){
  const s = (phone||'').trim();
  const m = s.match(/^(.*?)\s*(?:extension|ext\.?|x)\s*[:#.]?\s*(\d+)\s*$/i);
  if(m){ return { main: m[1].replace(/[^\d+]/g, ''), ext: m[2] }; }
  return { main: s.replace(/[^\d+]/g, ''), ext: null };
}
function telHref(phone){
  const p = splitPhoneExt(phone);
  return p.ext ? `${p.main};${p.ext}` : p.main;
}
function smsNumber(phone){ return splitPhoneExt(phone).main; }
function fmtDate(d){ if(!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-CA', {year:'numeric',month:'short',day:'numeric'}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(d){ const a = new Date(todayStr()+'T00:00:00'); const b = new Date(d+'T00:00:00'); return Math.round((b-a)/86400000); }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }
function toastHtml(){ return state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''; }
function lightboxHtml(){ return state.lightboxSrc ? `<div class="lightbox" id="lightbox"><img src="${state.lightboxSrc}"></div>` : ''; }
function territoryNameFor(id){ const t = state.territories.find(t=>t.id===id); return t ? t.name : '—'; }
function isAdmin(){ return state.profile && state.profile.role === 'admin'; }

// ---------- auth / bootstrap ----------
async function boot(){
  if(!configured){ state.bootLoading = false; render(); return; }

  const url = new URL(window.location.href);
  const hashParams = new URLSearchParams(url.hash.startsWith('#') ? url.hash.substring(1) : '');
  const isRecoveryUrl = url.searchParams.get('type') === 'recovery' || hashParams.get('type') === 'recovery';

  const { data } = await sb.auth.getSession();
  state.session = data.session;

  if(isRecoveryUrl && state.session){
    state.passwordRecovery = true;
    state.bootLoading = false;
    render();
  } else if(state.session){
    await afterLogin();
  } else {
    state.bootLoading = false; render();
  }

  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY'){
      state.passwordRecovery = true;
      state.session = session;
      state.bootLoading = false;
      render();
      return;
    }
    if(state.passwordRecovery) return;
    const hadSession = !!state.session;
    state.session = session;
    if(session && !hadSession){ afterLogin(); }
    else if(!session){
      state.profile = null; state.profilesList = []; state.territories = [];
      state.customers = []; state.notes = []; state.contacts = []; state.folders = [];
      state.bootLoading = false; render();
    }
  });
}

async function afterLogin(){
  state.bootLoading = true; render();
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(error){
    state.authError = 'Could not load your profile: ' + error.message;
    state.bootLoading = false; render(); return;
  }
  state.profile = prof;
  const { data: terrs } = await sb.from('territories').select('*');
  state.territories = terrs || [];
  state.bootLoading = false;
  if(isAdmin() || prof.territory_id){ await loadAll(); }
  else { render(); }
}

async function doSignUp(email, password){
  state.authBusy = true; state.authError = null; render();
  const { error } = await sb.auth.signUp({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  state.authMode = 'login';
  state.authError = null;
  render();
  showToast('Account created — check your email if confirmation is required, then log in.');
}
async function doLogin(email, password){
  state.authBusy = true; state.authError = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); }
}
async function doSignOut(){
  await sb.auth.signOut();
}
async function doForgotPassword(email){
  state.authBusy = true; state.authError = null; render();
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  state.authMode = 'login';
  render();
  showToast('Check your email for a password reset link.');
}
async function doSetNewPassword(newPassword){
  state.authBusy = true; state.authError = null; render();
  const { error } = await sb.auth.updateUser({ password: newPassword });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  state.passwordRecovery = false;
  showToast('Password updated.');
  await afterLogin();
}

// ---------- derived helpers ----------
function allFolders(){
  const names = new Set(state.folders.map(f=>f.name));
  return Array.from(names).sort();
}
async function ensureFolderExists(name, territory_id){
  if(!name) return;
  if(state.folders.some(f=>f.name===name)) return;
  const { data, error } = await sb.from('folders').insert([{ name, territory_id }]).select();
  if(error){
    if(!/duplicate|unique/i.test(error.message)) showToast('Could not create folder: ' + error.message);
    return;
  }
  if(data && data[0]) state.folders.push(data[0]);
}
async function deleteFolder(name){
  const { error: uErr } = await sb.from('customers').update({ folder: null }).eq('folder', name);
  if(uErr){ showToast('Delete failed: ' + uErr.message); return; }
  const folderRow = state.folders.find(f=>f.name===name);
  if(folderRow){
    const { error: dErr } = await sb.from('folders').delete().eq('id', folderRow.id);
    if(dErr){ showToast('Delete failed: ' + dErr.message); return; }
    state.folders = state.folders.filter(f=>f.id!==folderRow.id);
  }
  state.customers.forEach(c=>{ if(c.folder===name) c.folder=null; });
  if(state.folderFilter===name) state.folderFilter='ALL';
  render();
  showToast('Folder deleted');
}
function contactsFor(custId){
  return state.contacts.filter(ct => ct.customer_id === custId);
}
function csvEscape(val){
  if(val === null || val === undefined) return '';
  const s = String(val);
  if(/[",\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}
function exportCustomersToCSV(list, filename){
  const headers = ['Company','Street','City','Province','Postal Code','Folder','Territory','Size of Existing Sign','Contacts','Notes'];
  const rows = list.map(c => {
    const contacts = contactsFor(c.id).map(ct => {
      const namePart = [ct.name, ct.title].filter(Boolean).join(', ');
      const parts = [namePart, ct.phone, ct.email].filter(Boolean);
      return parts.join(' / ');
    }).join('; ');
    const notesText = notesFor(c.id).map(n => {
      const followUp = n.follow_up_date ? ` [Follow up: ${fmtDate(n.follow_up_date)}]` : '';
      return `${fmtDate(n.date_of_note)} (${n.created_by || 'Unknown'}): ${n.note_text}${followUp}`;
    }).join('\n');
    return [
      c.company, c.street, c.city, c.province, c.postal_code,
      c.folder || '', territoryNameFor(c.territory_id), c.size_of_existing_sign || '', contacts, notesText
    ];
  });
  const csvContent = '\uFEFF' + [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function filteredCustomers(){
  let list = state.customers;
  if(state.folderFilter !== 'ALL'){
    list = list.filter(c => (c.folder || '') === state.folderFilter);
  }
  const q = state.search.trim().toLowerCase();
  if(q){
    const matchingNoteCustIds = new Set(
      state.notes.filter(n => (n.note_text||'').toLowerCase().includes(q)).map(n => n.customer_id)
    );
    const matchingContactCustIds = new Set(
      state.contacts.filter(ct => (ct.name||'').toLowerCase().includes(q) || (ct.phone||'').toLowerCase().includes(q))
        .map(ct => ct.customer_id)
    );
    list = list.filter(c =>
      (c.company||'').toLowerCase().includes(q) ||
      (c.street||'').toLowerCase().includes(q) ||
      (c.city||'').toLowerCase().includes(q) ||
      (c.postal_code||'').toLowerCase().includes(q) ||
      matchingNoteCustIds.has(c.id) ||
      matchingContactCustIds.has(c.id)
    );
  }
  return list.slice().sort((a,b)=> (a.company||'').localeCompare(b.company||''));
}
function notesFor(custId){
  return state.notes.filter(n => n.customer_id === custId).sort((a,b)=> (b.date_of_note||'').localeCompare(a.date_of_note||''));
}
function estimatesFor(custId){
  return state.estimates.filter(e => e.customer_id === custId).sort((a,b)=> (b.date_of_estimate||'').localeCompare(a.date_of_estimate||''));
}
function allFollowUps(){
  return state.notes
    .filter(n => n.follow_up_date)
    .map(n => ({ note:n, cust: state.customers.find(c=>c.id===n.customer_id) }))
    .filter(x => x.cust)
    .sort((a,b)=> a.note.follow_up_date.localeCompare(b.note.follow_up_date));
}

// ---------- image compression + upload ----------
function compressToBlob(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.7);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(custId, blob){
  const path = `${custId}/${uid()}.jpg`;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// ---------- data actions ----------
async function fetchAll(table){
  const pageSize = 1000;
  let from = 0;
  let all = [];
  while(true){
    const { data, error } = await sb.from(table).select('*').range(from, from + pageSize - 1);
    if(error) return { data: null, error };
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return { data: all, error: null };
}
async function loadAll(){
  state.loading = true; state.error = null; render();
  const calls = [
    fetchAll('customers'),
    fetchAll('notes'),
    fetchAll('contacts'),
    fetchAll('folders'),
    fetchAll('estimates'),
  ];
  if(isAdmin()) calls.push(fetchAll('profiles'));

  const results = await Promise.all(calls);
  const errs = results.map(r=>r.error).filter(Boolean);
  if(errs.length){
    state.error = errs[0].message;
  } else {
    state.customers = results[0].data || [];
    state.notes = results[1].data || [];
    state.contacts = results[2].data || [];
    state.folders = results[3].data || [];
    state.estimates = results[4].data || [];
    if(isAdmin()) state.profilesList = (results[5] && results[5].data) || [];
  }
  state.loading = false;
  render();
}

// ===== LETTER LISTS: the four buttons at the top of a customer page =====
const LIST_DEFS = [
  { key: 'go_measure',      button: 'Go Measure',         title: 'Go Measure',         blurb: 'working list of customers to go and measure',                                      letter: false, sentName: '' },
  { key: 'no_signage',      button: 'No Signage Letter',  title: 'No Signage Letter',  blurb: 'churches with no signage \u2014 reach out about putting in signage',                letter: true,  sentName: 'No Signage' },
  { key: 'has_digital',     button: 'Has Digital Letter', title: 'Has Digital Letter', blurb: '\u201ctry us next time\u201d letter \u2014 we service other boards too',            letter: true,  sentName: 'Has Digital' },
  { key: 'estimate_letter', button: 'Estimate Letter',    title: 'Estimate Letter',    blurb: 'preliminary estimate letter \u2014 measured sign, proposed digital board and price',  letter: true,  sentName: 'Estimate' },
];
function listDefFor(status){ return LIST_DEFS.find(d => d.key === status) || null; }
function isListStatus(status){ return !!listDefFor(status); }
function listLabel(status){
  if(status === 'letter_queue') return 'Letter List';
  if(status === 'reminder_list') return 'Reminder List';
  const d = listDefFor(status);
  return d ? d.title + ' list' : 'list';
}
function oneLineAddress(c){
  const line = [c.company, c.street, c.city, c.postal_code].map(x => (x || '').trim()).filter(Boolean).join(', ');
  return line || '(no name)';
}
function listCustomers(status){
  return state.customers.filter(c => c.pipeline_status === status)
    .sort((a,b)=> (a.pipeline_status_at||'').localeCompare(b.pipeline_status_at||'') || (a.company||'').localeCompare(b.company||''));
}
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function listButtonsHtml(c){
  const cur = c.pipeline_status;
  const curDef = listDefFor(cur);
  const since = c.pipeline_status_at ? ' since ' + fmtDate(c.pipeline_status_at.slice(0,10)) : '';
  return `
    <div class="listbar">
      ${LIST_DEFS.map(d => `<button class="btn ${cur === d.key ? 'on' : 'ghost'}" data-list-btn="${d.key}" data-cust="${c.id}" title="${cur === d.key ? 'On this list \u2014 click to remove' : 'Add to the ' + esc(d.title) + ' list'}">${esc(d.button)}</button>`).join('')}
    </div>
    ${curDef ? `<div class="listnote">
        <span>On the <strong>${esc(curDef.title)}</strong> list${esc(since)}.</span>
        ${curDef.letter ? `<button class="btn small" data-mark-list-sent="${c.id}">Mark Letter Sent</button>` : ''}
        ${LETTER_TEMPLATES[curDef.key] ? `<button class="btn ghost small" data-open-print="${curDef.key}" data-print-cust="${c.id}">Print Letter</button>` : ''}
        <button class="btn ghost small" data-clear-pipeline="${c.id}">Remove from List</button>
      </div>` : ''}`;
}
function onListButton(custId, key){
  const c = state.customers.find(x => x.id === custId);
  const def = listDefFor(key);
  if(!c || !def) return;
  if(c.pipeline_status === key){
    if(confirm('Remove this customer from the ' + def.title + ' list?')) setPipelineStatus(custId, null, null);
    return;
  }
  if(c.pipeline_status){
    if(!confirm('This customer is on the ' + listLabel(c.pipeline_status) + ' right now. Move them to the ' + def.title + ' list instead?')) return;
  }
  setPipelineStatus(custId, key, 'Added to the ' + def.title + ' list.');
}
function onMarkListSent(custId){
  const c = state.customers.find(x => x.id === custId);
  const def = c ? listDefFor(c.pipeline_status) : null;
  if(!c || !def || !def.letter) return;
  setPipelineStatus(custId, 'reminder_list', def.sentName + ' letter sent \u2014 added to the 3x/year reminder email list.');
}
async function setPipelineStatus(custId, status, autoNoteText){
  const payload = { pipeline_status: status, pipeline_status_at: status ? new Date().toISOString() : null };
  const { error } = await sb.from('customers').update(payload).eq('id', custId);
  if(error){ showToast('Update failed: ' + error.message); return; }
  const c = state.customers.find(c=>c.id===custId);
  if(c) Object.assign(c, payload);
  if(autoNoteText){
    await addNote(custId, { note_text: autoNoteText, date_of_note: todayStr(), follow_up_date: null, photos: [] });
  }
  render();
  showToast('Updated');
}

// ---------- render ----------
// The customer list is the one inside the .layout wrapper (the Folders tab has its own, separate list)
function customerListEl(){ return document.querySelector('.layout > .list'); }
// Call this when the list is about to show something different (e.g. another folder) so it starts at the top
function resetListScroll(){ state.listScroll = 0; state.listScrollReset = true; }
function render(){
  // Remember how far the customer list is scrolled - but only while it is actually on screen.
  // On a phone the list is hidden while a customer is open, and a hidden list always reads 0,
  // which is what used to send "Back to list" to the top.
  const existingList = customerListEl();
  if(state.listScrollReset){ state.listScrollReset = false; }
  else if(existingList && getComputedStyle(existingList).display !== 'none'){ state.listScroll = existingList.scrollTop; }
  renderInner();
  const newList = customerListEl();
  if(newList && getComputedStyle(newList).display !== 'none') newList.scrollTop = state.listScroll;
}
function renderInner(){
  const root = document.getElementById('root');
  if(!configured){
    const msg = libraryFailedToLoad
      ? `Couldn't load a required file from the internet (the Supabase library). Check your internet connection and reload the page.`
      : `This app isn't connected to a database yet. Open <code>index.html</code> and fill in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the file.`;
    root.innerHTML = brandHeaderHtml() + `<main><div class="errbox">${msg}</div></main>`;
    return;
  }
  if(state.bootLoading){
    root.innerHTML = brandHeaderHtml() + '<div class="loading">Loading…</div>' + toastHtml();
    return;
  }
  if(state.passwordRecovery){
    root.innerHTML = resetPasswordScreenHtml() + toastHtml();
    bindResetPasswordEvents();
    return;
  }
  if(!state.session){
    root.innerHTML = authScreenHtml() + toastHtml();
    bindAuthEvents();
    return;
  }
  if(!state.profile){
    root.innerHTML = brandHeaderHtml() + '<div class="loading">Loading your profile…</div>' + toastHtml();
    return;
  }
  if(!isAdmin() && !state.profile.territory_id){
    root.innerHTML = pendingAssignmentHtml() + toastHtml();
    bindPendingEvents();
    return;
  }
  if(state.loading){
    root.innerHTML = headerHtml() + '<div class="loading">Loading customer data…</div>' + toastHtml();
    bindHeaderEvents();
    return;
  }
  let body = '';
  if(state.error){
    body = `<main><div class="errbox">Couldn't load data: ${esc(state.error)}</div></main>`;
  } else if(state.view === 'customers'){
    body = customersViewHtml();
  } else if(state.view === 'folders'){
    body = foldersViewHtml();
  } else if(state.view === 'team'){
    body = teamViewHtml();
  } else if(state.view === 'import'){
    body = importViewHtml();
  } else if(state.view === 'letterplan'){
    body = letterPlanViewHtml();
  } else {
    body = followupsViewHtml();
  }

  root.innerHTML = headerHtml() + navHtml() + body + toastHtml() + lightboxHtml() + modalsHtml();
  bindEvents();
}

function authScreenHtml(){
  if(state.authMode === 'forgot'){
    return `
    ${brandHeaderHtml()}
    <main style="max-width:420px; margin:60px auto;">
      <div class="card" style="padding:24px;">
        <h2 style="margin-top:0;">Reset Password</h2>
        ${state.authError ? `<div class="errbox">${esc(state.authError)}</div>` : ''}
        <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="forgotEmail"></div>
        <button class="btn amber" id="forgotSubmitBtn" style="width:100%;" ${state.authBusy?'disabled':''}>
          ${state.authBusy ? 'Please wait…' : 'Send Reset Link'}
        </button>
        <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--muted);">
          <a href="#" id="backToLoginFromForgot">Back to log in</a>
        </div>
      </div>
    </main>`;
  }
  return `
  ${brandHeaderHtml()}
  <main style="max-width:420px; margin:60px auto;">
    <div class="card" style="padding:24px;">
      <h2 style="margin-top:0;">${state.authMode==='login' ? 'Log In' : 'Create an Account'}</h2>
      ${state.authError ? `<div class="errbox">${esc(state.authError)}</div>` : ''}
      <div class="field" style="margin-bottom:10px;"><label>Email</label><input type="email" id="authEmail"></div>
      <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="authPassword"></div>
      <button class="btn amber" id="authSubmitBtn" style="width:100%;" ${state.authBusy?'disabled':''}>
        ${state.authBusy ? 'Please wait…' : (state.authMode==='login' ? 'Log In' : 'Sign Up')}
      </button>
      <div style="text-align:center; margin-top:14px; font-size:13px; color:var(--muted);">
        ${state.authMode==='login'
          ? `New here? <a href="#" id="toSignup">Create an account</a> · <a href="#" id="forgotPasswordLink">Forgot password?</a>`
          : `Already have an account? <a href="#" id="toLogin">Log in</a>`}
      </div>
      ${state.authMode==='signup' ? `<div style="margin-top:10px; font-size:12px; color:var(--muted);">After signing up, an admin needs to assign you to a territory before you can see any customers.</div>` : ''}
    </div>
  </main>`;
}
function bindAuthEvents(){
  const submitBtn = document.getElementById('authSubmitBtn');
  if(submitBtn){
    submitBtn.onclick = () => {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if(!email || !password){ state.authError = 'Enter an email and password.'; render(); return; }
      if(state.authMode==='login') doLogin(email, password);
      else doSignUp(email, password);
    };
  }
  const toSignup = document.getElementById('toSignup');
  if(toSignup){ toSignup.onclick = (e) => { e.preventDefault(); state.authMode='signup'; state.authError=null; render(); }; }
  const toLogin = document.getElementById('toLogin');
  if(toLogin){ toLogin.onclick = (e) => { e.preventDefault(); state.authMode='login'; state.authError=null; render(); }; }
  const forgotLink = document.getElementById('forgotPasswordLink');
  if(forgotLink){ forgotLink.onclick = (e) => { e.preventDefault(); state.authMode='forgot'; state.authError=null; render(); }; }
  const backToLogin = document.getElementById('backToLoginFromForgot');
  if(backToLogin){ backToLogin.onclick = (e) => { e.preventDefault(); state.authMode='login'; state.authError=null; render(); }; }
  const forgotSubmitBtn = document.getElementById('forgotSubmitBtn');
  if(forgotSubmitBtn){
    forgotSubmitBtn.onclick = () => {
      const email = document.getElementById('forgotEmail').value.trim();
      if(!email){ state.authError = 'Enter your email.'; render(); return; }
      doForgotPassword(email);
    };
  }
}

function resetPasswordScreenHtml(){
  return `
  ${brandHeaderHtml()}
  <main style="max-width:420px; margin:60px auto;">
    <div class="card" style="padding:24px;">
      <h2 style="margin-top:0;">Set a New Password</h2>
      ${state.authError ? `<div class="errbox">${esc(state.authError)}</div>` : ''}
      <div class="field" style="margin-bottom:14px;"><label>New Password</label><input type="password" id="newPasswordInput"></div>
      <button class="btn amber" id="setNewPasswordBtn" style="width:100%;" ${state.authBusy?'disabled':''}>
        ${state.authBusy ? 'Please wait…' : 'Set Password'}
      </button>
    </div>
  </main>`;
}
function bindResetPasswordEvents(){
  const btn = document.getElementById('setNewPasswordBtn');
  if(btn){
    btn.onclick = () => {
      const pw = document.getElementById('newPasswordInput').value;
      if(!pw || pw.length < 6){ state.authError = 'Password must be at least 6 characters.'; render(); return; }
      doSetNewPassword(pw);
    };
  }
}

function pendingAssignmentHtml(){
  return `

function bindHeaderEvents(){
  const btn = document.getElementById('signOutBtn');
  if(btn){ btn.onclick = doSignOut; }
  const editBtn = document.getElementById('editNameBtn');
  if(editBtn){
    editBtn.onclick = async () => {
      const current = state.profile.display_name || '';
      const name = prompt('Your display name (shown instead of your email):', current);
      if(name === null) return;
      const trimmed = name.trim();
      const { error } = await sb.rpc('update_my_display_name', { new_name: trimmed || null });
      if(error){ showToast('Could not save: ' + error.message); return; }
      state.profile.display_name = trimmed || null;
      render();
      showToast('Name updated');
    };
  }
}

function navHtml(){
  return `
  <nav>
    <button data-view="customers" class="${state.view==='customers'?'active':''}">Customers</button>
    <button data-view="folders" class="${state.view==='folders'?'active':''}">Folders</button>
    <button data-view="followups" class="${state.view==='followups'?'active':''}">Follow-Ups</button>
    <button data-view="letterplan" class="${state.view==='letterplan'?'active':''}">Letter Plan</button>
    <button data-view="import" class="${state.view==='import'?'active':''}">Import</button>
    ${isAdmin() ? `<button data-view="team" class="${state.view==='team'?'active':''}">Team</button>` : ''}
  </nav>`;
}

function letterPlanViewHtml(){
  const sel = state.lpList || 'go_measure';
  const tabs = [...LIST_DEFS.map(d => ({ key: d.key, label: d.title })), { key: 'letter_queue', label: 'Letter List' }, { key: 'reminder_list', label: 'Reminder List' }];
  const count = k => state.customers.filter(c => c.pipeline_status === k).length;
  const chips = `<div class="folder-chips" style="padding:12px 0 16px;">${tabs.map(t => `<span class="folder-chip ${sel === t.key ? 'active' : ''}" data-lp-tab="${t.key}">${esc(t.label)} \u00b7 ${count(t.key)}</span>`).join('')}</div>`;
  const def = listDefFor(sel);
  const body = def ? pipelineListHtml(def) : (sel === 'reminder_list' ? reminderSectionHtml() : letterQueueSectionHtml());
  return `
  <main>
    ${chips}
    ${body}
  </main>`;
}

function pipelineListHtml(def){
  const list = listCustomers(def.key);
  return `
    <div class="section-title">${esc(def.title)} <span style="font-weight:400; text-transform:none; letter-spacing:0;">\u2014 ${esc(def.blurb)}</span></div>
    <div class="toolbar" style="padding:0 0 12px;">
      <button class="btn ghost" data-copy-list="${def.key}">Copy List</button>
      <button class="btn ghost" data-export-list="${def.key}">Export CSV</button>
      ${LETTER_TEMPLATES[def.key] ? `<button class="btn amber" data-open-print="${def.key}">Print Letters &amp; Envelopes</button>` : (def.letter ? `<span style="font-size:12.5px; color:var(--muted); align-self:center;">No letter has been added for this list yet</span>` : '')}
    </div>
    <div class="card">
      ${list.length === 0 ? `<div class="empty">Nobody on the ${esc(def.title)} list yet. Use the \u201c${esc(def.button)}\u201d button at the top of a customer's page.</div>` :
        list.map(c => `
        <div class="followup-row">
          <div class="co" data-goto-cust="${c.id}" style="cursor:pointer;"><span class="oneline">${esc(oneLineAddress(c))}</span>
            <span style="font-weight:400; color:var(--muted); font-size:12px;"> \u00b7 since ${c.pipeline_status_at ? fmtDate(c.pipeline_status_at.slice(0,10)) : '\u2014'}</span>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-shrink:0;">
            ${def.letter ? `<button class="btn small" data-mark-list-sent="${c.id}">Mark Letter Sent</button>` : ''}
            <button class="btn ghost small" data-clear-pipeline="${c.id}">Remove</button>
          </div>
        </div>`).join('')}
    </div>`;
}

function letterQueueSectionHtml(){
  const letterQueue = state.customers.filter(c => c.pipeline_status === 'letter_queue')
    .sort((a,b)=> (a.pipeline_status_at||'').localeCompare(b.pipeline_status_at||'') || (a.company||'').localeCompare(b.company||''));
  const _unusedReminder = state.customers.filter(c => c.pipeline_status === 'reminder_list')
    .sort((a,b)=> (a.pipeline_status_at||'').localeCompare(b.pipeline_status_at||'') || (a.company||'').localeCompare(b.company||''));
  return `
    <div class="section-title">Letter List <span style="font-weight:400; text-transform:none; letter-spacing:0;">— customers ready for Deb's form letter</span></div>
    <div class="toolbar" style="padding:0 0 12px;">
      <button class="btn ghost" id="exportLetterListBtn">Export CSV</button>
    </div>
    <div class="card" style="margin-bottom:24px;">
      ${letterQueue.length===0 ? `<div class="empty">Nobody in the letter queue right now.</div>` :
        letterQueue.map(c => `
        <div class="followup-row">
          <div class="co" data-goto-cust="${c.id}" style="cursor:pointer;">${esc(c.company||'(no company name)')}</div>
          <div style="display:flex; gap:8px; align-items:center; flex-shrink:0;">
            <button class="btn small" data-mark-letter-sent="${c.id}">Mark Letter Sent</button>
            <button class="btn ghost small" data-clear-pipeline="${c.id}">Remove</button>
          </div>
        </div>`).join('')}
    </div>
`;
}

function reminderSectionHtml(){
  const letterQueue = state.customers.filter(c => c.pipeline_status === 'letter_queue')
    .sort((a,b)=> (a.pipeline_status_at||'').localeCompare(b.pipeline_status_at||'') || (a.company||'').localeCompare(b.company||''));
  const reminderList = state.customers.filter(c => c.pipeline_status === 'reminder_list')
    .sort((a,b)=> (a.pipeline_status_at||'').localeCompare(b.pipeline_status_at||'') || (a.company||'').localeCompare(b.company||''));
  return `
    <div class="section-title">Reminder List <span style="font-weight:400; text-transform:none; letter-spacing:0;">— gets a check-in email 3x a year</span></div>
    <div class="toolbar" style="padding:0 0 12px;">
      <button class="btn ghost" id="exportReminderListBtn">Export Emails (CSV)</button>
    </div>
    <div class="card">
      ${reminderList.length===0 ? `<div class="empty">Nobody on the reminder list yet.</div>` :
        reminderList.map(c => `
        <div class="followup-row">
          <div class="co" data-goto-cust="${c.id}" style="cursor:pointer;">${esc(c.company||'(no company name)')}
            <span style="font-weight:400; color:var(--muted); font-size:12px;"> · since ${c.pipeline_status_at ? fmtDate(c.pipeline_status_at.slice(0,10)) : '—'}</span>
          </div>
          <button class="btn ghost small" data-clear-pipeline="${c.id}">Remove</button>
        </div>`).join('')}
    </div>`;
}

function followUpBadge(followUpDate){
  if(!followUpDate) return '';
  const d = daysUntil(followUpDate);
  let cls = 'upcoming', label = `Follow up ${fmtDate(followUpDate)}`;
  if(d < 0){ cls='overdue'; label = `Overdue — was due ${fmtDate(followUpDate)}`; }
  else if(d === 0){ cls='overdue'; label = `Due today`; }
  else if(d <= 3){ cls='upcoming'; label = `Due in ${d}d — ${fmtDate(followUpDate)}`; }
  else { cls='done'; label = `Follow up ${fmtDate(followUpDate)}`; }
  return `<span class="badge ${cls}">${label}</span>`;
}

// ---------- events ----------
function bindEvents(){
  bindHeaderEvents();
  bindImportEvents();
  bindCalcEvents();
  bindLetterEvents();

  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view === 'import' && state.imp.stage === 'done') state.imp = newImportState();
      state.view = b.dataset.view; render();
    };
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = e => {
      const pos = e.target.selectionStart;
      state.search = e.target.value;
      render();
      const freshInput = document.getElementById('searchInput');
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(pos, pos); }
    };
  }
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  if(clearSearchBtn){
    clearSearchBtn.onclick = () => {
      state.search = '';
      render();
      const freshInput = document.getElementById('searchInput');
      if(freshInput) freshInput.focus();
    };
  }
  document.querySelectorAll('.folder-chip').forEach(el=>{
    el.onclick = () => { state.folderFilter = el.dataset.folder; resetListScroll(); render(); };
  });
  const newFolderBtn = document.getElementById('newFolderBtn');
  if(newFolderBtn){ newFolderBtn.onclick = () => { state.addingFolder = true; render(); }; }

  const cancelFolderBtn = document.getElementById('cancelFolderModal');
  if(cancelFolderBtn){ cancelFolderBtn.onclick = () => { state.addingFolder = false; render(); }; }
  const saveFolderBtn = document.getElementById('saveFolderModal');
  if(saveFolderBtn){
    saveFolderBtn.onclick = async () => {
      const name = document.getElementById('folder_name').value.trim();
      if(!name){ showToast('Enter a folder name'); return; }
      const territory_id = isAdmin() ? document.getElementById('folder_territory').value : state.profile.territory_id;
      const { data, error } = await sb.from('folders').insert([{ name, territory_id }]).select();
      if(error){ showToast('Could not create: ' + error.message); return; }
      state.folders.push(data[0]);
      state.addingFolder = false;
      render();
      showToast('Folder created');
    };
  }

  const assignFolderBtn = document.getElementById('assignFolderBtn');
  if(assignFolderBtn){
    assignFolderBtn.onclick = async () => {
      const sel = document.getElementById('folderAssignSel');
      let val = sel.value;
      const cust = state.customers.find(c=>c.id===assignFolderBtn.dataset.cust);
      if(val === '__new__'){
        val = (prompt('New folder name:') || '').trim();
        if(!val) return;
      }
      if(val && cust) await ensureFolderExists(val, cust.territory_id);
      await updateCustomer(assignFolderBtn.dataset.cust, { folder: val || null });
    };
  }

  const newBtn = document.getElementById('newCustomerBtn');
  if(newBtn){ newBtn.onclick = () => { state.addingCustomer = true; render(); }; }
  const exportCurrentBtn = document.getElementById('exportCurrentBtn');
  if(exportCurrentBtn){
    exportCurrentBtn.onclick = () => {
      const label = state.folderFilter !== 'ALL' ? (state.folderFilter || 'No Folder') : 'All Customers';
      exportCustomersToCSV(filteredCustomers(), `${label}.csv`);
    };
  }

  document.querySelectorAll('.cust-item[data-id]').forEach(el=>{
    el.onclick = () => { state.selectedId = el.dataset.id; render(); };
  });
  document.querySelectorAll('.cust-item[data-folder]').forEach(el=>{
    el.onclick = () => { state.folderFilter = el.dataset.folder; resetListScroll(); state.view = 'customers'; state.selectedId = null; render(); };
  });
  document.querySelectorAll('[data-export-folder]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      const folderName = el.dataset.exportFolder;
      const list = state.customers.filter(c => c.folder === folderName);
      exportCustomersToCSV(list, `${folderName}.csv`);
    };
  });
  document.querySelectorAll('[data-del-folder]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm(`Delete the "${el.dataset.delFolder}" folder? Customers inside it will not be deleted, just unassigned from it.`)){
        deleteFolder(el.dataset.delFolder);
      }
    };
  });

  const backToListBtn = document.getElementById('backToListBtn');
  if(backToListBtn){ backToListBtn.onclick = () => { state.selectedId = null; render(); }; }

  document.querySelectorAll('[data-share-cust]').forEach(el=>{
    el.onclick = async (e) => {
      e.stopPropagation();
      const c = state.customers.find(c=>c.id===el.dataset.shareCust);
      if(!c) return;
      const notes = notesFor(c.id);
      const latest = notes[0];
      const lines = [
        c.company || '(no company name)',
        [c.street, c.city, c.province, c.postal_code].filter(Boolean).join(', '),
      ];
      if(latest){
        lines.push('');
        lines.push(`Latest note (${fmtDate(latest.date_of_note)}): ${latest.note_text}`);
        if(latest.follow_up_date) lines.push(`Follow up: ${fmtDate(latest.follow_up_date)}`);
      }
      const shareText = lines.join('\n');
      if(navigator.share){
        try{ await navigator.share({ title: c.company || 'Customer', text: shareText }); }
        catch(err){ /* cancelled */ }
      } else {
        try{ await navigator.clipboard.writeText(shareText); showToast('Copied — paste it into a text, email, etc.'); }
        catch(err){ showToast('Could not share automatically'); }
      }
    };
  });
  document.querySelectorAll('[data-edit-cust]').forEach(el=>{
    el.onclick = (e) => { e.stopPropagation(); state.editingCustomer = true; render(); };
  });
  document.querySelectorAll('[data-del-cust]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(confirm('Delete this customer, their contacts, and all their notes? This cannot be undone.')){
        deleteCustomer(el.dataset.delCust);
      }
    };
  });
  document.querySelectorAll('[data-send-letter-list]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      setPipelineStatus(el.dataset.sendLetterList, 'letter_queue', 'Sent to the Letter List after repeated call attempts with no answer.');
    };
  });
  document.querySelectorAll('[data-mark-letter-sent]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      setPipelineStatus(el.dataset.markLetterSent, 'reminder_list', 'Form letter sent — added to the 3x/year reminder email list.');

];
const IMPORT_PLACEHOLDERS = new Set(['not verified','not specified','n/a','na','none','tbd','unknown','-','--','?','null','nil']);
const IMPORT_HEADER_LABELS = {
  company: ['name','company','company name','church name','business name','organization','organisation','school','school name','facility','customer'],
  street: ['street','street address','address','address line 1','street name'],
  city: ['city','town','municipality'],
  province: ['province','prov','state'],

  contact_title: ['title','job title','position','role'],
  phone: ['phone','phone number','telephone','tel'],
  email: ['email','e-mail','email address'],
};
const IMPORT_HEADER_WORDS = new Set([].concat(...Object.values(IMPORT_HEADER_LABELS)));
const IMPORT_STOP_TOKENS = new Set(['church','the','of','and','united','saint','st','christian','community','chapel']);
const POSTAL_RE = /^[A-Za-z]\d[A-Za-z][ -]?\d[A-Za-z]\d$/;
const PROV_RE = /^(ON|QC|BC|AB|MB|SK|NS|NB|NL|PE|PEI|YT|NT|NU)$/i;
const PHONE_RE = /^\+?[\d\s().\-]{7,}(?:\s*(?:ext\.?|extension|x)\s*\d+)?$/i;

function cleanCell(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/[\u200b-\u200d\ufeff]/g, '').replace(/\s+/g, ' ').trim();
}
function normKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
const STREET_WORDS = { street:'st', avenue:'ave', road:'rd', drive:'dr', boulevard:'blvd', court:'ct', crescent:'cres', lane:'ln',
  place:'pl', circle:'cir', highway:'hwy', parkway:'pkwy', square:'sq', terrace:'terr', east:'e', west:'w', north:'n', south:'s' };
function normStreet(s){
  return (String(s || '').toLowerCase().match(/[a-z0-9]+/g) || []).map(t => STREET_WORDS[t] || t).join('');
}
function nameTokens(s){
  return new Set((String(s || '').toLowerCase().match(/[a-z0-9]+/g) || []).filter(t => t.length >= 2 && !IMPORT_STOP_TOKENS.has(t)));
}
function looksLikeStreet(s){ return /^\d/.test(s) && /[A-Za-z]/.test(s) && s.length >= 5 && !PHONE_RE.test(s); }

// ---------- CSV ----------
function parseCsv(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if(ch === '"' && field === ''){ inQ = true; }
    else if(ch === ','){ row.push(field); field = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else field += ch;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function decodeCsvBytes(u8){
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); }
  catch(e){ return new TextDecoder('windows-1252').decode(u8); }
}

// ---------- shared XML helpers ----------
function xmlDoc(bytes){
  return new DOMParser().parseFromString(new TextDecoder('utf-8').decode(bytes), 'application/xml');
}
function elementChildren(el){ return Array.from(el.childNodes).filter(n => n.nodeType === 1); }

// ---------- XLSX ----------
function xlsxColIndex(ref){
  const m = /^([A-Za-z]+)/.exec(ref || '');
  if(!m) return -1;
  let n = 0;
  for(const c of m[1].toUpperCase()) n = n * 26 + (c.charCodeAt(0) - 64);
  return n - 1;
}
function xlsxTextOf(el){
  let out = '';
  for(const child of elementChildren(el)){
    if(child.localName === 't') out += child.textContent;
    else if(child.localName === 'r'){
      for(const t of elementChildren(child)) if(t.localName === 't') out += t.textContent;
    }
  }
  return out;
}
function parseSheetXml(doc, shared){
  const rows = [];
  for(const rowEl of Array.from(doc.getElementsByTagNameNS('*', 'row'))){
    const arr = []; let next = 0;
    for(const c of elementChildren(rowEl)){
      if(c.localName !== 'c') continue;
      const ref = c.getAttribute('r');
      let ci = ref ? xlsxColIndex(ref) : next;
      if(ci < 0) ci = next;
      next = ci + 1;
      const t = c.getAttribute('t');
      let val = '';
      if(t === 'inlineStr'){
        const is = elementChildren(c).find(n => n.localName === 'is');
        val = is ? xlsxTextOf(is) : '';
      } else {
        const v = elementChildren(c).find(n => n.localName === 'v');
        const raw = v ? v.textContent : '';
        if(t === 's') val = shared[parseInt(raw, 10)] !== undefined ? shared[parseInt(raw, 10)] : '';
        else if(t === 'b') val = raw === '1' ? 'TRUE' : 'FALSE';
        else if(t === 'e') val = '';
        else val = raw;
      }
      arr[ci] = val;
    }
    const full = Array.from(arr, v => v === undefined ? '' : v);
    if(full.some(v => String(v).trim() !== '')) rows.push(full);
  }
  return rows;
}
function parseXlsx(u8){
  const files = fflate.unzipSync(u8, {
    filter: f => f.originalSize <= 60e6 &&
      /^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^\/]+\.xml)$/.test(f.name)
  });
  if(!files['xl/workbook.xml']) throw new Error('This does not look like an Excel (.xlsx) file.');
  const shared = [];
  if(files['xl/sharedStrings.xml']){
    for(const si of Array.from(xmlDoc(files['xl/sharedStrings.xml']).getElementsByTagNameNS('*', 'si'))) shared.push(xlsxTextOf(si));
  }
  const rels = {};
  if(files['xl/_rels/workbook.xml.rels']){
    for(const r of Array.from(xmlDoc(files['xl/_rels/workbook.xml.rels']).getElementsByTagNameNS('*', 'Relationship'))){
      rels[r.getAttribute('Id')] = r.getAttribute('Target');
    }
  }
  const sheets = [];
  Array.from(xmlDoc(files['xl/workbook.xml']).getElementsByTagNameNS('*', 'sheet')).forEach((s, i) => {
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || s.getAttribute('r:id');
    let target = (rels[rid] || ('worksheets/sheet' + (i + 1) + '.xml')).replace(/^\//, '');
    const path = target.startsWith('xl/') ? target : 'xl/' + target;
    sheets.push({ name: s.getAttribute('name') || ('Sheet ' + (i + 1)), rows: files[path] ? parseSheetXml(xmlDoc(files[path]), shared) : [] });
  });
  return sheets;
}

// ---------- ODS (OpenDocument) ----------
const NS_TABLE = 'urn:oasis:names:tc:opendocument:xmlns:table:1.0';
const NS_TEXT = 'urn:oasis:names:tc:opendocument:xmlns:text:1.0';
const NS_OFFICE = 'urn:oasis:names:tc:opendocument:xmlns:office:1.0';
function odsTextOf(node){
  let out = '';
  for(const ch of Array.from(node.childNodes)){
    if(ch.nodeType === 3) out += ch.nodeValue;
    else if(ch.nodeType === 1){
      if(ch.localName === 's') out += ' '.repeat(Math.min(parseInt(ch.getAttributeNS(NS_TEXT, 'c') || '1', 10) || 1, 50));
      else if(ch.localName === 'tab') out += '\t';
      else if(ch.localName === 'line-break') out += '\n';
      else out += odsTextOf(ch);
    }
  }
  return out;
}
function odsCellText(cell){
  const parts = [];
  for(const ch of elementChildren(cell)) if(ch.localName === 'p' && ch.namespaceURI === NS_TEXT) parts.push(odsTextOf(ch));
  let txt = parts.join('\n');
  if(txt === ''){ const v = cell.getAttributeNS(NS_OFFICE, 'value'); if(v) txt = v; }
  return txt;
}
function odsCollectRows(parent, rows){
  for(const el of elementChildren(parent)){
    if(el.namespaceURI !== NS_TABLE) continue;
    if(el.localName === 'table-row'){
      const repeat = Math.min(parseInt(el.getAttributeNS(NS_TABLE, 'number-rows-repeated') || '1', 10) || 1, 1000);
      const arr = []; let col = 0;
      for(const cell of elementChildren(el)){
        if(cell.namespaceURI !== NS_TABLE || (cell.localName !== 'table-cell' && cell.localName !== 'covered-table-cell')) continue;
        const crep = parseInt(cell.getAttributeNS(NS_TABLE, 'number-columns-repeated') || '1', 10) || 1;
        const txt = odsCellText(cell);
        if(txt !== ''){ for(let k = 0; k < Math.min(crep, 50); k++) arr[col + k] = txt; }
        col += crep;
      }
      const full = Array.from(arr, v => v === undefined ? '' : v);
      if(full.some(v => String(v).trim() !== '')){ for(let r = 0; r < repeat; r++) rows.push(full.slice()); }
    } else if(el.localName === 'table-header-rows' || el.localName === 'table-row-group' || el.localName === 'table-rows'){
      odsCollectRows(el, rows);
    }
  }
}
function parseOds(u8){
  const files = fflate.unzipSync(u8, { filter: f => f.name === 'content.xml' && f.originalSize <= 100e6 });
  if(!files['content.xml']) throw new Error('This does not look like an OpenDocument (.ods) file.');
  const doc = xmlDoc(files['content.xml']);
  const sheets = [];
  for(const tbl of Array.from(doc.getElementsByTagNameNS(NS_TABLE, 'table'))){
    if(tbl.parentNode && tbl.parentNode.localName === 'table-cell') continue;
    const rows = [];
    odsCollectRows(tbl, rows);
    sheets.push({ name: tbl.getAttributeNS(NS_TABLE, 'name') || ('Sheet ' + (sheets.length + 1)), rows });
  }
  return sheets;
}

// ---------- header + column guessing ----------
function detectHeader(rows){
  if(!rows.length) return false;
  const cells = rows[0].map(cleanCell).filter(v => v !== '');
  if(cells.length < 2) return false;
  if(cells.some(v => POSTAL_RE.test(v) || (PHONE_RE.test(v) && !/[a-z]/i.test(v)) || /@/.test(v))) return false;
  const hits = cells.filter(v => IMPORT_HEADER_WORDS.has(v.toLowerCase())).length;
  return hits >= 2;
}
function guessMappingFromHeader(headerRow){
  const mapping = headerRow.map(() => '');
  const used = new Set();
  const labels = headerRow.map(h => cleanCell(h).toLowerCase());
  // "contact name" etc. must win over the generic "name" => company
  const order = ['contact_name','contact_title','company','street','city','province','postal','phone','email'];
  for(const field of order){
    const idx = labels.findIndex((l, i) => mapping[i] === '' && IMPORT_HEADER_LABELS[field].includes(l));
    if(idx >= 0 && !used.has(field)){ mapping[idx] = field; used.add(field); }
  }
  return mapping;
}
function guessMappingByContent(rows){
  const sample = rows.slice(0, 60);
  const ncols = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const stats = [];
  for(let c = 0; c < ncols; c++){
    const vals = sample.map(r => cleanCell(r[c])).filter(v => v !== '');
    const n = vals.length || 1;
    const frac = f => vals.filter(f).length / n;
    stats.push({
      n: vals.length,
      email: frac(v => /@/.test(v)),
      postal: frac(v => POSTAL_RE.test(v)),
      prov: frac(v => PROV_RE.test(v)),
      phone: frac(v => PHONE_RE.test(v) && !POSTAL_RE.test(v)),
      street: frac(looksLikeStreet),
    });
  }
  const mapping = new Array(ncols).fill('');
  const assign = (field, test) => {
    for(let c = 0; c < ncols; c++) if(mapping[c] === '' && stats[c].n > 0 && test(stats[c])){ mapping[c] = field; return c; }
    return -1;
  };
  assign('email', s => s.email >= 0.5);
  const postalC = assign('postal', s => s.postal >= 0.6);
  const provC = assign('province', s => s.prov >= 0.6);
  assign('phone', s => s.phone >= 0.5);
  const streetC = assign('street', s => s.street >= 0.6);

  const remaining = () => { const r = []; for(let c = 0; c < ncols; c++) if(mapping[c] === '' && stats[c].n > 0) r.push(c); return r; };
  // city: first leftover column after the street and before province/postal
  if(streetC >= 0){
    const limit = Math.max(provC, postalC);
    const cityC = remaining().find(c => c > streetC && limit > c);
    if(cityC !== undefined) mapping[cityC] = 'city';
  }
  // left of street: last = company, earlier ones = contact name, then title
  const left = remaining().filter(c => streetC < 0 ? true : c < streetC);
  if(left.length){
    const companyC = streetC < 0 ? left[0] : left[left.length - 1];
    mapping[companyC] = 'company';
    const others = left.filter(c => c !== companyC);
    if(others[0] !== undefined) mapping[others[0]] = 'contact_name';
    if(others[1] !== undefined) mapping[others[1]] = 'contact_title';
  }
  // right of street: first leftover = contact name, next = title
  const right = remaining().filter(c => streetC >= 0 && c > streetC);
  for(const c of right){
    if(!mapping.includes('contact_name')) mapping[c] = 'contact_name';
    else if(!mapping.includes('contact_title')) mapping[c] = 'contact_title';
  }
  if(!mapping.includes('company')){ const r = remaining(); if(r.length) mapping[r[0]] = 'company'; }
  return mapping;
}
function guessMapping(rows, hasHeader){
  if(hasHeader){
    const m = guessMappingFromHeader(rows[0]);
    const width = rows.reduce((mx, r) => Math.max(mx, r.length), 0);
    while(m.length < width) m.push('');
    return m;
  }
  return guessMappingByContent(rows);
}

// ---------- building the import plan ----------
function normalizePostal(s){
  const m = /^([A-Za-z]\d[A-Za-z])[ -]?(\d[A-Za-z]\d)$/.exec(s);
  return m ? (m[1] + ' ' + m[2]).toUpperCase() : s;
}
function isHeaderLikeRow(cells){
  const nonEmpty = cells.filter(v => v !== '');
  const hits = nonEmpty.filter(v => IMPORT_HEADER_WORDS.has(v.toLowerCase())).length;
  return hits >= 3 || (nonEmpty.length >= 2 && hits >= 2 && hits === nonEmpty.length);
}
function buildExistingIndex(customers){
  const byStreet = new Map(), byCompanyCity = new Map();
  for(const c of customers){
    const s = normStreet(c.street);
    if(s){ if(!byStreet.has(s)) byStreet.set(s, []); byStreet.get(s).push(c); }
    else byCompanyCity.set(normKey(c.company) + '|' + normKey(c.city), c);
  }
  return { byStreet, byCompanyCity };
}
function findExistingMatch(cust, idx){
  const s = normStreet(cust.street);
  if(s){
    const list = idx.byStreet.get(s) || [];
    for(const e of list) if(normKey(e.company) === normKey(cust.company)) return { existing: e, exact: true };
    const a = nameTokens(cust.company);
    for(const e of list){ for(const t of nameTokens(e.company)) if(a.has(t)) return { existing: e, exact: false }; }
  } else {
    const e = idx.byCompanyCity.get(normKey(cust.company) + '|' + normKey(cust.city));
    if(e) return { existing: e, exact: true };
  }
  return null;
}
function buildImportPlan(rows, hasHeader, mapping, existingCustomers){
  const plan = { customers: [], skippedExact: [], skippedPossible: [], ignored: [], mergedRows: 0, totalRows: 0 };
  const data = rows.slice(hasHeader ? 1 : 0);
  plan.totalRows = data.length;
  const cols = {};
  mapping.forEach((f, i) => { if(f){ (cols[f] = cols[f] || []).push(i); } });
  const get = (row, field) => {
    for(const i of (cols[field] || [])){ const v = cleanCell(row[i]); if(v !== '') return v; }
    return '';
  };
  const groups = new Map();
  data.forEach((row, n) => {
    const cells = row.map(cleanCell);
    if(!cells.some(v => v !== '')) return;
    const rowNum = n + 1 + (hasHeader ? 1 : 0);
    if(isHeaderLikeRow(cells)){ plan.ignored.push({ row: rowNum, reason: 'looks like a repeated header row', text: cells.filter(Boolean).join(' | ') }); return; }
    const company = get(row, 'company');
    if(!company){ plan.ignored.push({ row: rowNum, reason: 'no company name', text: cells.filter(Boolean).join(' | ') }); return; }
    if(cells.filter(v => v !== '').length === 1){ plan.ignored.push({ row: rowNum, reason: 'only one cell filled (title or note row?)', text: company }); return; }
    if(/@/.test(company) && !/\s/.test(company)){ plan.ignored.push({ row: rowNum, reason: 'company column holds an email address', text: company }); return; }
    let postal = get(row, 'postal').replace(/\.+$/, '');
    let province = get(row, 'province');
    if(/^[A-Za-z]{2}$/.test(province)) province = province.toUpperCase();
    const cust = { company, street: get(row, 'street'), city: get(row, 'city'), province, postal: normalizePostal(postal) };
    const ph = (get(row, 'phone')).replace(/\.+$/, '');
    const contact = {
      name: get(row, 'contact_name'),
      title: get(row, 'contact_title'),
      phone: ph,
      email: get(row, 'email'),
    };
    for(const k of Object.keys(contact)) if(IMPORT_PLACEHOLDERS.has(contact[k].toLowerCase())) contact[k] = '';
    const key = normKey(company) + '|' + (normStreet(cust.street) || ('c:' + normKey(cust.city)));
    let g = groups.get(key);
    if(!g){ g = Object.assign({}, cust, { contacts: [] }); groups.set(key, g); }
    else {
      plan.mergedRows++;
      for(const k of ['street','city','province','postal']) if(!g[k] && cust[k]) g[k] = cust[k];
    }
    if(contact.name || contact.phone || contact.email){
      const sharesDetail = c => (contact.phone && c.phone === contact.phone) || (contact.email && c.email.toLowerCase() === contact.email.toLowerCase());
      const same = g.contacts.find(c =>
        (contact.name && c.name && normKey(c.name) === normKey(contact.name)) ||
        ((!contact.name || !c.name) && sharesDetail(c)));
      if(same){ for(const k of Object.keys(contact)) if(!same[k] && contact[k]) same[k] = contact[k]; }
      else g.contacts.push(contact);
    }
  });
  const idx = buildExistingIndex(existingCustomers || []);
  for(const g of groups.values()){
    const m = findExistingMatch(g, idx);
    if(!m) plan.customers.push(g);
    else if(m.exact) plan.skippedExact.push({ customer: g, matched: m.existing });
    else plan.skippedPossible.push({ customer: g, matched: m.existing });
  }
  return plan;
}
// Which already-existing customers (matched exactly) could be moved into the target folder?
function planMoves(plan, folder, territoryId){
  const seen = new Set(), toMove = [], inFolder = [], otherTerritory = [];
  for(const x of plan.skippedExact){
    const e = x.matched;
    if(seen.has(e.id)) continue;
    seen.add(e.id);
    if(territoryId && e.territory_id && e.territory_id !== territoryId) otherTerritory.push(e);
    else if((e.folder || '') === folder) inFolder.push(e);
    else toMove.push(e);
  }
  return { toMove, inFolder, otherTerritory };
}

function uuid4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0'));
  return h.slice(0,4).join('') + '-' + h.slice(4,6).join('') + '-' + h.slice(6,8).join('') + '-' + h.slice(8,10).join('') + '-' + h.slice(10).join('');
}
function readFileBytes(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error || new Error('Could not read the file.'));
    fr.readAsArrayBuffer(file);
  });
}
function colLetter(i){ let s = ''; i++; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function impRows(){ const s = state.imp.sheets[state.imp.sheetIdx]; return s ? s.rows : []; }
function impTerritoryId(){ return isAdmin() ? state.imp.territory_id : (state.profile && state.profile.territory_id); }
function impCurrentPlan(){
  if(!state.imp.mapping.includes('company')) return null;
  return buildImportPlan(impRows(), state.imp.hasHeader, state.imp.mapping, state.customers);
}
function impCustomersToAdd(plan){
  return plan.customers.concat(state.imp.includeDupes ? plan.skippedPossible.map(x => x.customer) : []);
}
function impSuggestFolder(fileName){
  return fileName.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
}
function impComputeCounts(){
  const imp = state.imp;
  const plan = impCurrentPlan();
  const toAdd = plan ? impCustomersToAdd(plan) : [];
  const mv = plan ? planMoves(plan, imp.folder.trim(), impTerritoryId()) : { toMove: [], inFolder: [], otherTerritory: [] };
  imp._count = toAdd.length;
  imp._moveCount = imp.moveExisting ? mv.toMove.length : 0;
  return { plan, toAdd, mv };
}

}

async function handleImportFile(file){
  const imp = state.imp;
  if(!file) return;
  imp.error = null;
  try{
    if(file.size > 10 * 1024 * 1024) throw new Error('That file is over 10 MB. Please split it into smaller files.');
    const bytes = new Uint8Array(await readFileBytes(file));
    const lower = file.name.toLowerCase();
    let sheets;
    if(lower.endsWith('.csv') || lower.endsWith('.txt')){
      sheets = [{ name: 'CSV', rows: parseCsv(decodeCsvBytes(bytes)) }];
    } else {
      if(!(bytes[0] === 0x50 && bytes[1] === 0x4b)) throw new Error('This file type isn\u2019t supported. Please use .xlsx, .ods or .csv (for an old .xls file, open it in Excel and use Save As \u2192 .xlsx).');
      try { sheets = lower.endsWith('.ods') ? parseOds(bytes) : parseXlsx(bytes); }
      catch(e){ sheets = lower.endsWith('.ods') ? parseXlsx(bytes) : parseOds(bytes); }
    }
    sheets = sheets.map(s => ({ name: s.name, rows: s.rows.map(r => r.map(cleanCell)) })).filter(s => s.rows.length > 0);
    if(!sheets.length) throw new Error('No data was found in that file.');
    if(sheets.some(s => s.rows.length > 5000)) throw new Error('That sheet has more than 5,000 rows. Please split it into smaller files.');
    const rows = sheets[0].rows;
    imp.fileName = file.name;
    imp.sheets = sheets;
    imp.sheetIdx = 0;
    imp.hasHeader = detectHeader(rows);
    imp.mapping = guessMapping(rows, imp.hasHeader);
    imp.folder = impSuggestFolder(file.name);
    imp.includeDupes = false;
    imp.territory_id = isAdmin() ? (state.profile.territory_id || '') : state.profile.territory_id;
    imp.stage = 'map';
  } catch(e){
    imp.error = e.message || String(e);
  }
  render();
}

async function runImport(){
  const imp = state.imp;
  if(imp.busy) return;
  const plan = impCurrentPlan();
  if(!plan) return;
  const toAdd = impCustomersToAdd(plan);
  const folder = imp.folder.trim();
  const territory_id = impTerritoryId();
  const moveRows = imp.moveExisting ? planMoves(plan, folder, territory_id).toMove : [];
  if((!toAdd.length && !moveRows.length) || !folder || !territory_id) return;
  imp.busy = true; imp.error = null; imp.createdIds = []; imp.moved = []; imp.progress = 'Preparing\u2026'; render();

  const custRows = [], contactRows = [];
  for(const c of toAdd){
    const id = uuid4();
    custRows.push({ id, company: c.company, street: c.street || null, city: c.city || null, province: c.province || null,
                    postal_code: c.postal || null, folder, territory_id });
    for(const ct of c.contacts) contactRows.push({ customer_id: id, name: ct.name || null, title: ct.title || null, phone: ct.phone || null, email: ct.email || null });
  }
  let contactsAdded = 0;
  try{
    await ensureFolderExists(folder, territory_id);
    for(let i = 0; i < custRows.length; i += 200){
      const chunk = custRows.slice(i, i + 200);
      imp.progress = `Adding customers\u2026 ${Math.min(i + 200, custRows.length)} of ${custRows.length}`; render();
      const { error } = await sb.from('customers').insert(chunk);
      if(error) throw new Error(error.message);
      chunk.forEach(r => imp.createdIds.push(r.id));
    }
    for(let i = 0; i < contactRows.length; i += 300){
      const chunk = contactRows.slice(i, i + 300);
      imp.progress = `Adding contacts\u2026 ${Math.min(i + 300, contactRows.length)} of ${contactRows.length}`; render();
      const { error } = await sb.from('contacts').insert(chunk);
      if(error) throw new Error(error.message);
      contactsAdded += chunk.length;
    }
    for(let i = 0; i < moveRows.length; i += 100){
      const chunk = moveRows.slice(i, i + 100);
      imp.progress = `Moving existing customers\u2026 ${Math.min(i + 100, moveRows.length)} of ${moveRows.length}`; render();
      const previous = chunk.map(c => ({ id: c.id, prev: c.folder || null }));   // remember BEFORE changing, so undo can restore it
      const { error } = await sb.from('customers').update({ folder }).in('id', chunk.map(c => c.id));
      if(error) throw new Error(error.message);
      previous.forEach(p => imp.moved.push(p));
    }
  } catch(e){
    imp.busy = false; imp.progress = '';
    imp.error = `The import stopped part-way (${e.message}). ${imp.createdIds.length} customers and ${contactsAdded} contacts were saved${imp.moved.length ? ' and ' + imp.moved.length + ' existing customers were moved' : ''} before it stopped. You can undo what was added, or fix the problem and run the same file again \u2014 customers already added are skipped automatically.`;
    await loadAll();
    return;
  }
  imp.busy = false; imp.progress = '';
  imp.result = { customers: custRows.length, contacts: contactRows.length, moved: imp.moved.length, folder };
  imp.stage = 'done';
  await loadAll();
}

async function undoImport(){
  const imp = state.imp;
  const ids = imp.createdIds.slice();
  const moved = imp.moved.slice();
  if((!ids.length && !moved.length) || imp.busy) return;
  imp.busy = true; imp.error = null; render();
  const byPrev = new Map();
  moved.forEach(m => { const k = m.prev === null ? '\u0000none' : m.prev; if(!byPrev.has(k)) byPrev.set(k, []); byPrev.get(k).push(m.id); });

const ESTIMATE_RATES = {
  frameInches: 3.5,          // frame adds this much TOTAL to width and to height
  moduleWidthInches: 12.6,
  moduleHeightInches: 6.3,
  costPerModule: 78,
  pricePerModule: 234,
};
// Works in whole tenths of an inch so the maths is exact (no 3.9999999 -> 3 surprises).
function calcLedEstimate(widthIn, heightIn, doubleSided, rates){
  rates = rates || ESTIMATE_RATES;
  if(!isFinite(widthIn) || !isFinite(heightIn) || widthIn <= 0 || heightIn <= 0){
    return { ok: false, reason: 'Enter the sign\u2019s width and height.' };
  }
  const t = v => Math.round(v * 10);
  const W = t(widthIn), H = t(heightIn), F = t(rates.frameInches), MW = t(rates.moduleWidthInches), MH = t(rates.moduleHeightInches);
  const usableW = W - F, usableH = H - F;
  const cols = usableW > 0 ? Math.floor(usableW / MW) : 0;
  const rows = usableH > 0 ? Math.floor(usableH / MH) : 0;
  if(cols < 1 || rows < 1){
    return { ok: false, cols, rows, usableW: usableW / 10, usableH: usableH / 10,
      reason: 'Too small for a full module \u2014 after the ' + rates.frameInches + '" frame, the screen area has to be at least ' + rates.moduleWidthInches + '" \u00d7 ' + rates.moduleHeightInches + '".' };
  }
  const perBoard = cols * rows;
  const boards = doubleSided ? 2 : 1;
  const modules = perBoard * boards;
  const overallW = cols * MW + F, overallH = rows * MH + F;
  return {
    ok: true, cols, rows, perBoard, boards, modules,
    cost: modules * rates.costPerModule, price: modules * rates.pricePerModule,
    usableW: usableW / 10, usableH: usableH / 10,
    overallW: overallW / 10, overallH: overallH / 10,
    spareW: (W - overallW) / 10, spareH: (H - overallH) / 10,
  };
}
// "4x8", "4' x 8'", "48\" x 96\"", "96 x 48 in", "4 ft by 8 ft" -> { w, h, unit }.  The longer side is taken as the width.
function parseSignSize(text){
  const s = String(text || '').toLowerCase().replace(/[\u201c\u201d\u2033]/g, '"').replace(/[\u2018\u2019\u2032]/g, "'");
  const m = s.match(/(\d+(?:\.\d+)?)\s*(?:'|ft|feet|foot|"|in(?:ch(?:es)?)?)?\s*(?:x|\u00d7|by|\*)\s*(\d+(?:\.\d+)?)/);
  if(!m) return null;
  const a = parseFloat(m[1]), b = parseFloat(m[2]);
  if(!(a > 0) || !(b > 0)) return null;
  let unit = null;
  if(/'|\bft\b|feet|foot/.test(s)) unit = 'ft';
  else if(/"|\bin\b|inch/.test(s)) unit = 'in';
  if(!unit) unit = (a <= 20 && b <= 20) ? 'ft' : 'in';
  return { w: Math.max(a, b), h: Math.min(a, b), unit };
}
function fmtInches(n){ return (Math.round(n * 10) / 10) + '"'; }
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString('en-CA'); }

state.calc = { custId: null, sizeText: '', w: '', h: '', unit: 'ft', double: false, prefilled: false };

function calcEnsure(c){
  const sizeText = c.size_of_existing_sign || '';
  if(state.calc.custId === c.id && state.calc.sizeText === sizeText) return state.calc;
  const p = parseSignSize(sizeText);
  state.calc = { custId: c.id, sizeText, w: p ? String(p.w) : '', h: p ? String(p.h) : '', unit: p ? p.unit : 'ft', double: false, prefilled: !!p };
  return state.calc;
}
function calcCompute(calc){
  const k = calc.unit === 'ft' ? 12 : 1;
  return calcLedEstimate(parseFloat(calc.w) * k, parseFloat(calc.h) * k, calc.double);
}
function calcResultHtml(calc){

    ${calc.double ? line('Boards', '2 (double sided)') + line('Total modules', '<strong>' + r.modules + '</strong>') : ''}
    ${line('New sign size, frame included', fmtInches(r.overallW) + ' \u00d7 ' + fmtInches(r.overallH))}

      <div style="font-size:24px; font-weight:800;">${fmtMoney(r.price)}</div>
    </div>
    ${isAdmin() ? `<div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:2px;"><span>Our cost: ${fmtMoney(r.cost)}</span><span>Margin: ${fmtMoney(r.price - r.cost)} (${Math.round((r.price - r.cost) / r.price * 1000) / 10}%)</span></div>` : ''}
  </div>`;
}

function calcRefresh(){
  const out = document.getElementById('calcResult');

function calcSummaryText(calc, r){
  const k = calc.unit === 'ft' ? 12 : 1;
  const wIn = parseFloat(calc.w) * k, hIn = parseFloat(calc.h) * k;
  const entered = calc.unit === 'ft' ? `${parseFloat(calc.w)} ft \u00d7 ${parseFloat(calc.h)} ft (${fmtInches(wIn)} \u00d7 ${fmtInches(hIn)})` : `${fmtInches(wIn)} \u00d7 ${fmtInches(hIn)}`;
  const lines = [
    `LED reader board \u2014 ${calc.double ? 'double sided' : 'single sided'}`,
    `Existing sign: ${entered}`,
    `Screen area after the ${ESTIMATE_RATES.frameInches}" frame: ${fmtInches(r.usableW)} \u00d7 ${fmtInches(r.usableH)}`,
    `Modules (${ESTIMATE_RATES.moduleWidthInches}" \u00d7 ${ESTIMATE_RATES.moduleHeightInches}"): ${r.cols} across \u00d7 ${r.rows} down = ${r.perBoard} per board`,
  ];
  if(calc.double) lines.push(`Boards: 2 \u2192 ${r.modules} modules total`);
  lines.push(`New sign size, frame included: ${fmtInches(r.overallW)} \u00d7 ${fmtInches(r.overallH)}`);
  lines.push(`Price: ${fmtMoney(r.price)} (${r.modules} modules \u00d7 ${fmtMoney(ESTIMATE_RATES.pricePerModule)})`);
  return lines.join('\n');
}
